<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5E7A">
<title>SKY MARBELLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF0EF; --panel:#FFFFFF; --panel2:#F5F6F5; --ink:#1C2326; --ink2:#51606A; --ink3:#86939B;
  --line:#D9DEDF; --line2:#C4CBCE; --accent:#1F5E7A; --accentInk:#FFFFFF; --accentSoft:#DCEAF0;
  --canvas:#FAFBFA;
  --tV:#2E9E4F; --tA:#E0A800; --tR:#D5403A;
  --s-instalada:#15803D; --s-en_obra:#2F6FB3; --s-en_obra-bg:#DCEAF8; --s-pedida:#56687A; --s-pedida-bg:#FFFFFF; --s-medir:#7B4FC9; --s-sin_pedir:#9AA5AD; --s-sin_pedir-bg:#EEF0F1;
  --p-instalada:#15803D; --p-en_obra:#2F6FB3; --p-pedida:#E39410; --p-medir:#7B4FC9; --p-sin_pedir:#E3E7EA;
  --k-instalada:#15803D; --k-en_obra:#3B82C4; --k-pedida:#F2A71B; --k-medir:#7B4FC9; --k-sin_pedir:#D3D8DC; --k-inc:#D81B60; --k-descartada:#3A3F44; --kInkDark:#1C2326;
  --wood:#B07A43; --wood2:#8A5A2B; --film:#9CC7E6;
  --s-inc_detectada:#D81B60; --s-inc_pale:#EF7D1A; --s-inc_macrif:#A0522D; --s-inc_reparar:#00838F; --s-descartada:#3A3F44;
  --ok:#0B6B45; --warn:#B9620B; --bad:#C4204F; --info:#1F5E7A;
  --okSoft:#DDEFE6; --warnSoft:#FBEBD9; --badSoft:#F8DDE6; --infoSoft:#DCEAF0;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#131719; --panel:#1B2124; --panel2:#20272A; --ink:#E4E9EA; --ink2:#A7B3B8; --ink3:#728087;
    --line:#2D3539; --line2:#3B4549; --accent:#6FB3D1; --accentInk:#0E1A20; --accentSoft:#1E3440;
    --canvas:#161B1D;
    --s-sin_pedir:#6C777E; --s-sin_pedir-bg:#262D30; --s-pedida:#9DB0C2; --s-pedida-bg:#1B2124; --s-en_obra:#5B9BE0; --s-en_obra-bg:#1F3347; --s-instalada:#2FB36A; --s-medir:#A07BE6;
    --p-instalada:#2FB36A; --p-en_obra:#4F8FD6; --p-pedida:#E8A33A; --p-medir:#A07BE6; --p-sin_pedir:#3A4448; --s-descartada:#8A9197; --s-inc_macrif:#C0703F; --s-inc_reparar:#20A7B5;
    --k-instalada:#2FB36A; --k-en_obra:#4F8FD6; --k-pedida:#E8A33A; --k-medir:#9A73E0; --k-sin_pedir:#4A5358; --k-inc:#F0508A; --k-descartada:#8A9197; --kInkDark:#111;
    --ok:#3FBF8A; --warn:#F0A04B; --bad:#F06292; --info:#6FB3D1;
    --okSoft:#17332A; --warnSoft:#3A2A17; --badSoft:#3A1C27; --infoSoft:#1E3440;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.35;margin:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.ico{width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top ---------- */
.top{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;align-items:center;gap:10px 18px;padding:8px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:21px;letter-spacing:.06em}
.brand small{color:var(--ink3);font-size:13px}
.kpis{display:flex;gap:18px;flex-wrap:wrap}
.kpi{display:flex;align-items:center;gap:7px}
.kpi .ico{width:18px;height:18px}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);line-height:1.1}
.tabrow{display:flex;align-items:center;gap:8px;padding-right:14px}
.tabrow .tabs{flex:1;min-width:0}
.userbox{display:flex;align-items:center;gap:8px;flex:none}
.sync{font-size:12px;color:var(--ink3)}
.who{font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px 8px;border-bottom:3px solid transparent;color:var(--ink2);font-weight:600;white-space:nowrap;font-size:15px;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--badSoft);color:var(--bad);font-size:12px;text-align:center}

main{flex:1;min-height:0;overflow:auto;padding:14px 18px 110px}
main.fit{overflow:hidden;display:flex;flex-direction:column;padding-bottom:14px}
main.fit.multi{padding-bottom:84px}
.wrap{max-width:1500px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;background:var(--panel);flex-wrap:nowrap}
.seg button{border:0;background:none;padding:5px 10px;font-weight:600;color:var(--ink2);border-right:1px solid var(--line);display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:disabled{color:var(--ink3);cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--panel2) 4px 8px)}
.btn{border:1px solid var(--line2);background:var(--panel);padding:6px 12px;border-radius:5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.ok{background:var(--s-instalada);border-color:var(--s-instalada);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.warn{color:#fff;background:var(--s-inc_detectada);border-color:var(--s-inc_detectada)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.sm{padding:3px 8px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{border:1px solid var(--line2);background:var(--panel);border-radius:5px;padding:5px 8px;min-width:0}
textarea{width:100%;resize:vertical}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 6px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent;color:#fff;background:var(--c)}
.pill.pale{color:var(--ink);background:var(--bgc);border-color:var(--c)}
.pill.outline{color:var(--ink);background:var(--bgc);border:1.5px dashed var(--c)}
.pill.pale .ico,.pill.outline .ico{color:var(--c)}
.tdot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;flex:none;background:var(--c)}
.tchip{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--okSoft);color:var(--ok)} .chip.warn{background:var(--warnSoft);color:var(--warn)} .chip.bad{background:var(--badSoft);color:var(--bad)} .chip.info{background:var(--infoSoft);color:var(--info)} .chip.neu{background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sechead h2{font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- plano ---------- */
.plantools{flex:none;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.planwrap{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px}
.empty-piece{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:40px 20px!important;color:var(--ink2);height:100%}
.empty-piece .ico{width:34px;height:34px;color:var(--ink3)}
.progress .pbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.progress .pbar u{display:block;height:100%}
.legend.big .lg{grid-template-columns:24px 1fr auto;padding:5px 6px;font-size:14.5px}
.canvasbox{position:relative;height:100%;min-height:300px;overflow:hidden;background:var(--canvas);border:1px solid var(--line);border-radius:6px;touch-action:none}
.canvasbox.multi{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.canvasbox svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.canvasbox .zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.canvasbox .zoom button{width:36px;height:36px;border:1px solid var(--line2);background:var(--panel);border-radius:5px;font-size:18px;font-weight:600}
.canvasbox .ttl{position:absolute;left:12px;top:10px;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.canvasbox .ttl b{font-size:18px;letter-spacing:.04em}
.canvasbox .banner{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:var(--accent);color:var(--accentInk);padding:5px 12px;border-radius:14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.canvasbox .hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--ink3);background:var(--canvas);padding:2px 6px;border-radius:4px}
.pc{cursor:pointer}
.pc polygon.body{stroke-width:1.6;vector-effect:non-scaling-stroke}
.pc polygon.hit{fill:transparent;stroke:transparent;stroke-width:12;vector-effect:non-scaling-stroke}
.pc.inst polygon.body{stroke:#0B3D1F!important;stroke-width:1.6}
.pc .tdotS{stroke:var(--canvas);stroke-width:.05}
.pc.focus polygon.body{stroke:var(--accent)!important;stroke-width:4.5}
.pc.sel polygon.body{stroke:var(--accent)!important;stroke-width:2.5}
.pc polygon.halo{fill:var(--accent);stroke:var(--accent);stroke-width:9;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.9}
.pc.dim{opacity:.13}
.pc.ghost polygon.body{stroke-dasharray:4 3}
.pc text{font-family:var(--mono);font-weight:600;pointer-events:none;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke-width:.09;stroke-linejoin:round;fill:var(--ink);stroke:var(--canvas)}
.pc.inst text{fill:#fff;stroke:none}
.pc .badge circle{stroke:var(--canvas);stroke-width:.06}
.pc .badge use{color:#fff}
.pc .selmark circle{fill:var(--accent)}
.pc .selmark use{color:var(--accentInk)}
.side{height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.side .panel{padding:13px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat3 button{border:1px solid var(--line);border-radius:6px;padding:8px 9px;text-align:left;background:var(--panel);display:flex;flex-direction:column;gap:1px}
.stat3 button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-1px}
.stat3 b{font-size:25px;line-height:1.05;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.stat3 b .ico{width:20px;height:20px}
.stat3 small{font-size:12px}
.stat3 .yes{background:var(--s-instalada);border-color:var(--s-instalada);color:#fff}
.stat3 .no{background:var(--s-en_obra-bg);border-color:var(--s-en_obra);color:var(--ink)}
.stat3 .inc{background:var(--badSoft);border-color:var(--s-inc_detectada);color:var(--bad)}
.tipos3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tipos3 button{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:5px;padding:6px 8px;background:var(--panel);text-align:left}
.tipos3 button[aria-pressed="false"]{opacity:.4}
.tipos3 b{font-size:17px;font-variant-numeric:tabular-nums}
.tbar{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden;margin-top:4px}
.tbar u{display:block;height:100%;background:var(--s-instalada)}
.legend{display:flex;flex-direction:column;gap:2px}
.lg{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:3px 6px;border-radius:4px;border:0;background:none;text-align:left;width:100%}
.lg:hover{background:var(--panel2)}
.lg[aria-pressed="true"]{background:var(--accentSoft)}
.sw{width:24px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff}
.sw.pale{background:var(--bgc);box-shadow:inset 0 0 0 1.5px var(--c);color:var(--c)}
.sw.outline{background:var(--bgc);border:1.5px dashed var(--c);color:var(--c)}
.sw .ico{width:13px;height:13px;stroke-width:2.8}
.sw.badge{background:var(--canvas);box-shadow:inset 0 0 0 1.5px var(--line2)}
.sw.badge i{width:15px;height:15px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff}
.sw.badge .ico{width:10px;height:10px;stroke-width:3}

/* piece card */
.piecehead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.piecehead .code{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.bigstate{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;margin:10px 0;background:var(--c);color:#fff;font-weight:700;font-size:16px}
.bigstate.pale,.bigstate.outline{background:var(--bgc);color:var(--ink);box-shadow:inset 0 0 0 2px var(--c)}
.bigstate.outline{box-shadow:none;border:2px dashed var(--c)}
.bigstate.pale .ico,.bigstate.outline .ico{color:var(--c)}
.bigstate .ico{width:22px;height:22px}
.bigstate small{font-weight:500;font-size:13px;opacity:.9;display:block}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.actions .full{grid-column:1/-1}
.instrow{display:flex;gap:6px;grid-column:1/-1}
.instrow input{flex:1}
.tl{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tl li{position:relative;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--tlc,var(--ink3));border:2px solid var(--panel)}
.tl .d{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:12.5px;margin-right:6px}
.inc{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.inc .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.inc label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink3)}
.inc label input,.inc label select{color:var(--ink);font-size:14px}
.steps{display:flex;gap:0;align-items:flex-start}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;text-align:center;color:var(--ink3);position:relative}
.step i{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:2px solid var(--line2);color:var(--ink3);z-index:1}
.step i .ico{width:15px;height:15px}
.step::after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--line2)}
.step:last-child::after{display:none}
.step.done i{background:var(--c);border-color:var(--c);color:#fff}
.step.done::after{background:var(--c)}
.step.cur i{background:var(--panel);border-color:var(--c);color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.step.cur{color:var(--ink);font-weight:600}
.step small{font-variant-numeric:tabular-nums}
.photos{display:flex;gap:6px;flex-wrap:wrap}
.photos img,.photos .ph{width:72px;height:72px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:var(--panel2);cursor:zoom-in}
.photos .ph{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px}
.addphoto{width:72px;height:72px;border:1.5px dashed var(--line2);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--ink2);cursor:pointer;background:var(--panel)}
.addphoto .ico{width:20px;height:20px}
.mini{width:100%;height:120px;border:1px solid var(--line);border-radius:5px;background:var(--canvas);display:block}
.mini polygon{stroke-width:1;vector-effect:non-scaling-stroke}

/* selection bar */
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--panel);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
.selbar input,.selbar select{background:transparent;color:var(--panel);border-color:rgba(127,127,127,.6)}
.selbar select option{color:#000}
.selbar .btn{background:transparent;color:var(--panel);border-color:rgba(127,127,127,.6)}
.selbar .btn.ok{background:var(--s-instalada);border-color:var(--s-instalada);color:#fff}
.selbar .btn.warn{background:var(--s-inc_detectada);border-color:var(--s-inc_detectada);color:#fff}
.selbar .btn.on{background:var(--panel);color:var(--ink)}
.selbar b{font-variant-numeric:tabular-nums}
.selbar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.selbar .sep{width:1px;height:26px;background:rgba(127,127,127,.5)}

/* tables & lists */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--panel2)}
tfoot td{font-weight:700;background:var(--panel2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--c)}
.col h3{font-size:15.5px;display:flex;align-items:center;gap:7px}
.col h3 .ico{color:var(--c);width:19px;height:19px}
.col h3 .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2)}
.card{border:1px solid var(--line);border-radius:5px;padding:8px;background:var(--panel2);display:grid;grid-template-columns:auto 1fr;gap:8px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--ink3)}
.card .thumb{width:54px;height:54px;border-radius:4px;object-fit:cover;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.card .thumb .ico{width:22px;height:22px}
.card .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.alert{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .t{font-weight:700}
.codes-inline{display:flex;flex-wrap:wrap;gap:4px}
.codebtn{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-left:4px solid var(--c,var(--line2));background:var(--panel);border-radius:4px;padding:1px 5px}
.codebtn:hover{border-color:var(--accent);color:var(--accent)}
details.docrow{border-bottom:1px solid var(--line)}
details.docrow summary{display:grid;grid-template-columns:120px 90px 1fr auto;gap:10px;padding:9px 12px;cursor:pointer;align-items:center;list-style:none}
details.docrow summary::-webkit-details-marker{display:none}
details.docrow[open] summary{background:var(--panel2)}
.docbody{padding:10px 12px 14px}
.bars{display:flex;flex-direction:column;gap:8px}
.bline{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.stack u{display:block;height:100%}
.empty{padding:34px 20px;text-align:center;color:var(--ink2)}
.bigstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bigstats div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel)}
.bigstats b{display:block;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.bigstats small{color:var(--ink2);font-size:13px}
.miss{display:inline-flex;gap:9px;align-items:center}

/* palés */
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.palcard{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;position:relative}
.palcard:hover{border-color:var(--ink3);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.palcard.cerrado{background:color-mix(in srgb,#2F6FB3 11%,var(--panel));border:2px solid #7FB0D8}
.palcard.abierto{background:var(--panel);border:2px dashed #E0A24A}
.stbadge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:4px;white-space:nowrap}
.stbadge.closed{background:#2F6FB3;color:#fff}
.stbadge.open{background:#FBE7C6;color:#8A4B00;border:1px solid #E0A24A}
.stbadge.devb{background:var(--s-inc_pale);color:#fff}
.stbadge .ico{width:12px;height:12px}
.colorbar{display:flex;gap:2px;height:20px;border-radius:4px;overflow:hidden;margin:2px 0}
.cseg{background:var(--c);display:flex;align-items:center;justify-content:center;min-width:22px}
.cseg b{color:#fff;font-size:12.5px;text-shadow:0 0 2px rgba(0,0,0,.4)}
.palsec.closed{border-left:6px solid #2F6FB3;padding:14px}
.palsec.open{border-left:6px solid #E0A24A;padding:14px}
.palsec.devs{border-left:6px solid var(--s-inc_pale);padding:14px}
.palstat .closed{background:color-mix(in srgb,#2F6FB3 11%,var(--panel));border-color:#7FB0D8}
.palstat .open{border:2px dashed #E0A24A}
.pfbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:12px 14px}
.pftipos{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pftipos .label{width:100%}
.tbtn{border:1px solid var(--line2);background:var(--panel);border-radius:16px;padding:4px 10px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.tbtn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tbtn[aria-pressed="true"] .tdot{background:#fff}
.pf{display:flex;flex-direction:column;gap:2px}
.palcard.dev{border:2px solid var(--s-inc_pale);background:color-mix(in srgb,var(--s-inc_pale) 7%,var(--panel))}
.palcard.vacio{opacity:.6}
.palcard svg.pal{width:100%;height:auto;display:block}
.palcard .pn{font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.palcard .cnt{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.palcard .cnt small{font-size:13px;color:var(--ink3);font-weight:600}
.palstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.palstat button{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);display:flex;align-items:center;gap:12px;text-align:left}
.palstat button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-1px}
.palstat svg{width:64px;flex:none}
.palstat b{font-size:28px;line-height:1;font-variant-numeric:tabular-nums;display:block}
.palhero{max-width:300px;margin:4px auto 8px}

/* calendar */
.calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.calhead h2{font-size:20px;text-transform:capitalize;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(90px,1.2fr);gap:4px}
.cal .dh{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600;padding:2px 4px}
.day{min-height:78px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--panel);display:flex;flex-direction:column;gap:2px;position:relative}
.day.we{background:repeating-linear-gradient(135deg,var(--panel2) 0 5px,var(--panel) 5px 10px)}
.day.out{opacity:.35}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day .dn{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.day .inst{display:flex;align-items:baseline;gap:4px;font-weight:700;font-size:22px;line-height:1;color:var(--s-instalada)}
.day .inst small{font-size:11px;font-weight:600;color:var(--ink3)}
.day .bar{height:5px;border-radius:3px;background:var(--s-instalada);margin-top:auto}
.day .arr{font-size:12px;color:var(--s-en_obra);font-weight:600;display:flex;align-items:center;gap:3px}
.day .arr .ico{width:13px;height:13px}
.wk{border-radius:5px;padding:4px 8px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:12.5px}
.wk b{font-size:17px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:90;background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90vw}
.modalbg{position:fixed;inset:0;background:rgba(10,15,18,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--panel);overflow:auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-height:90vh;max-width:95vw;border-radius:4px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.formgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink3)}
.formgrid label input,.formgrid label select{color:var(--ink);font-size:14px}
.prev{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:5px;margin-top:8px}
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.login form{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px 24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.login h1{font-size:26px;letter-spacing:.06em}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.login input{font-size:16px;padding:9px 10px;color:var(--ink)}
.login .btn{padding:10px;font-size:16px}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;text-align:left;font-size:13.5px;text-decoration:underline}

@media (max-width:900px){
  body{overflow:auto;display:block;height:auto}
  main,main.fit{overflow:visible;display:block;padding:10px 12px 130px}
  .planwrap{display:flex;flex-direction:column}
  .canvasbox{height:58dvh}
  .side{height:auto;overflow:visible}
  #piecepanel{display:none}
  .planwrap .canvasbox{order:-1}
  .kpis{gap:12px;order:3;width:100%}
  .tabrow{flex-direction:column-reverse;align-items:stretch;padding-right:0}
  .userbox{padding:4px 12px 0;justify-content:flex-end}
  .who{display:none}
  .kpi b{font-size:16px}
  .brand small{display:none}
  .modalbg{align-items:flex-end}
  .drawer{width:100%;height:auto;max-height:82dvh;border-left:0;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
  .drawer::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:-6px auto 10px}
  details.docrow summary{grid-template-columns:1fr auto}
  .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal .wk,.cal .dh.wkh{display:none}
  .day{min-height:58px;padding:3px}
  .day .inst{font-size:17px}
  .day .inst small{display:none}
  .canvasbox .hint{display:none}
  .selbar{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .selbar .sep{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =================== incidencias: normalización =================== */
function normInc(i){
  const o={...i};
  if(!o.tipoInc){o.tipoInc={MAL:'mecanizado',ROTA:'rotura','DAÑADA EN OBRA':'obra',OTRO:'otra'}[o.tipo]||(INC_TIPOS[o.tipo]?o.tipo:'otra')}
  if(o.destino===undefined){o.destino={macrif:'macrif',nueva:'macrif',obra:'obra',descartar:'descartar'}[o.accion]||''}
  if(o.fechaRetirada===undefined&&o.fechaEnvio)o.fechaRetirada=o.fechaEnvio;
  if(o.destino==='obra'&&!o.fechaReparada&&o.resuelta)o.fechaReparada=o.resuelta;
  if(o.destino==='macrif'&&!o.fechaVuelta&&o.resuelta)o.fechaVuelta=o.resuelta;
  if(!o.retiradaRef&&o.pedidoEx)o.retiradaRef=o.pedidoEx;
  o.fotos=o.fotos||[];
  return o;
}
function incFase(p,i){
  if(i.destino==='descartar')return 'descartada';
  if(i.destino==='obra')return i.fechaReparada?'reparada':'reparar';
  if(i.destino==='macrif'){
    if(i.fechaRetirada){const b=p.ent.find(e=>e.fecha>i.fechaRetirada);i._back=b||null;return (b||i.fechaVuelta)?'vuelta':'retirada'}
    return 'pale';
  }
  return 'detectada';
}
function stripInc(i){const o={...i};for(const k of Object.keys(o))if(k.startsWith('_'))delete o[k];delete o.accion;delete o.fechaEnvio;delete o.resuelta;delete o.pedidoEx;if(o.tipoInc){o.tipo=o.tipoInc;delete o.tipoInc}return o}

/* =================== derivación =================== */
let P={}, LIST=[], ALERTS=[], MACHI={}, PEDS=[], PALES=[], DEVS=[];
function parseId(id){const [b,p,n]=id.split('-');return {bl:b,pl:p,n}}
function derive(){
  P={};
  for(const [bl,doc] of Object.entries(S.bloques)){
    for(const [id,v] of Object.entries(doc.piezas||{})){
      const g=GEO[id];
      P[id]={...v,id,bl,pl:v.pl||parseId(id).pl,n:parseId(id).n,color:v.color||(g&&g[0]),incs:(v.incs||[]).map(normInc),log:v.log||[],ent:[],fac:[],peds:[]};
    }
  }
  const peds=Object.values(S.peds).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||a.num.localeCompare(b.num));
  for(const d of peds)for(const l of d.lineas||[]){const p=P[l.p];if(p)p.peds.push({doc:d.num,fecha:d.fecha,tipo:d.tipo,c:l.c})}
  const albs=Object.values(S.albs).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||a.num.localeCompare(b.num));
  for(const a of albs)for(const l of a.lineas||[]){const p=P[l.p];if(p)p.ent.push({doc:a.num,fecha:a.fecha,m2:l.m2,c:l.c,pale:l.pale,nota:l.nota,ped:l.ped,sinAlb:!!a.sinAlbaran})}
  const facts=Object.values(S.facts).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||a.num.localeCompare(b.num));
  for(const f of facts)for(const l of f.lineas||[]){const p=P[l.p];if(p)p.fac.push({doc:f.num,fecha:f.fecha,m2:l.m2,txt:l.txt})}
  for(const p of Object.values(P)){
    const f=p.peds.find(x=>x.tipo!=='reposicion')||p.peds[0];p.ped=f?f.doc:null;p.fped=f?f.fecha:null;
    p.incs.forEach((i,ix)=>{i._ix=ix;i._fase=incFase(p,i)});
    // entregas que son vuelta de Macrif (posteriores a una retirada)
    p.ent.forEach((e,ix)=>{e.vuelta=ix>0&&p.incs.some(i=>['macrif','descartar'].includes(i.destino)&&(i.fechaRetirada||i.fecha||'')<e.fecha)});
    const open=p.incs.filter(i=>!CLOSED.has(i._fase));
    p.open=open.length?open[open.length-1]:null;
    const last=p.incs[p.incs.length-1];
    let e;
    if(p.open)e=FASE_EST[p.open._fase];
    else if(last&&last._fase==='descartada'&&!p.ent.some(x=>x.fecha>(last.fecha||'')))e='descartada';
    else if(p.inst)e='instalada';
    else if(p.ent.length)e='en_obra';
    else if(p.peds.length)e='pedida';
    else if(p.medir)e='medir';
    else e='sin_pedir';
    p.estado=e;
    const fx=p.fac.length,en=p.ent.length;
    p.factEst=fx>1?'doble':fx&&!en?'sin_entrega':fx?'facturada':en?'sin_facturar':'nada';
    p.m2Ref=p.m2??(p.ent.length?p.ent[p.ent.length-1].m2:null);
  }
  LIST=Object.values(P).sort((a,b)=>a.bl.localeCompare(b.bl)||(a.o||0)-(b.o||0));
  PEDS=peds.map(d=>{
    const lineasX=(d.lineas||[]).map(l=>{const p=P[l.p];const lleg=p?p.ent.find(e=>e.fecha>=d.fecha):null;return {...l,pz:p,lleg}});
    const pend=lineasX.filter(l=>!l.lleg);
    const faltan={V:0,A:0,R:0};pend.forEach(l=>{const c=l.c||(l.pz&&l.pz.color);if(faltan[c]!=null)faltan[c]++});
    const tot={V:0,A:0,R:0};lineasX.forEach(l=>{const c=l.c||(l.pz&&l.pz.color);if(tot[c]!=null)tot[c]++});
    return {...d,lineasX,llegadas:lineasX.length-pend.length,pend:pend.length,pendL:pend,faltan,tot,dn:diasNat(d.fecha),dl:diasLab(d.fecha)};
  });
  buildPales(albs);
  buildAlerts(albs,facts);
}
function buildPales(albs){
  const M={};
  for(const a of albs){if(a.sinAlbaran)continue;for(const l of a.lineas||[]){
    const key=l.pale!=null?`${a.fecha}-${l.pale}`:`${a.fecha}-${a.num}`;
    const g=M[key]=M[key]||{key,fecha:a.fecha,pale:l.pale,albs:new Set(),lineas:[]};g.albs.add(a.num);g.lineas.push(l.p);
  }}
  PALES=Object.values(M).map(g=>{
    const ov=S.pales['in_'+safeId(g.key)]||{};
    const items=g.lineas.map(id=>{const p=P[id];if(!p)return null;
      const k=p.ent.map(e=>(e.pale!=null?`${e.fecha}-${e.pale}`:`${e.fecha}-${e.doc}`)).lastIndexOf(g.key);
      const latest=k===p.ent.length-1;const e=p.ent[k];
      let where='palé';
      if(!latest)where='volvió en otra entrega';
      else if(p.inst)where='instalada';
      else if(p.open&&['pale','retirada'].includes(p.open._fase)&&(p.open.fecha||'')>=e.fecha)where='devolución';
      else if(p.estado==='descartada')where='descartada';
      return {p,e,on:where==='palé',where};
    }).filter(Boolean);
    const rest=items.filter(x=>x.on);
    const cnt={V:0,A:0,R:0};rest.forEach(x=>cnt[x.p.color]!=null&&cnt[x.p.color]++);
    const peds=[...new Set(items.map(x=>x.p.ped).filter(Boolean))];
    const vuelta=items.some(x=>x.e&&x.e.vuelta);
    let st=ov.vaciado||!rest.length?'vacio':(ov.abierto||rest.length<items.length)?'abierto':'cerrado';
    return {...g,albs:[...g.albs],items,rest,cnt,total:items.length,st,ov,peds,vuelta,docId:'in_'+safeId(g.key)};
  }).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.pale||0)-(a.pale||0));
  // palés de devolución
  const devDocs=Object.entries(S.pales).filter(([,d])=>d.tipo==='dev').map(([id,d])=>({id,...d})).sort((a,b)=>(a.num||0)-(b.num||0));
  const byId=Object.fromEntries(devDocs.map(d=>[d.id,{...d,items:[]}]));
  const loose={id:null,num:null,virtual:true,items:[]};
  for(const p of LIST)for(const i of p.incs){
    if(i.paleDev&&byId[i.paleDev]){const d=byId[i.paleDev];if(d.enviado?(i.fechaRetirada===d.enviado):i._fase==='pale')d.items.push({p,i})}
    else if(i._fase==='pale')loose.items.push({p,i});
  }
  DEVS=Object.values(byId);if(loose.items.length)DEVS.unshift(loose);
}
function buildAlerts(albs,facts){
  const A=[];const add=(sev,t,d,codes)=>{if(codes.length)A.push({sev,t,d,codes})};
  add('bad','Facturadas sin albarán de entrega','Macrif las ha cobrado pero no constan en ningún albarán.',LIST.filter(p=>p.fac.length&&!p.ent.length).map(p=>p.id));
  add('bad','Facturadas más de una vez','Una pieza se factura una sola vez aunque vuelva de Macrif en otros albaranes.',LIST.filter(p=>p.fac.length>1).map(p=>p.id));
  add('warn','Entregadas y sin facturar','Constan en albarán pero todavía en ninguna factura.',LIST.filter(p=>p.ent.length&&!p.fac.length).map(p=>p.id));
  add('warn','Más entregas de las justificadas','Llegan más veces que 1 + las veces que se han devuelto a Macrif.',LIST.filter(p=>p.ent.length>1+p.incs.filter(i=>['macrif','descartar'].includes(i.destino)).length).map(p=>p.id));
  add('warn','m² distintos entre albarán y factura','La factura no coincide con la primera entrega (diferencia > 0,015 m²).',LIST.filter(p=>{const fm=p.fac.length?p.fac[0].m2:null,am=p.ent.length?p.ent[0].m2:null;return fm!=null&&am!=null&&Math.abs(fm-am)>0.015}).map(p=>p.id));
  add('info','m² facturados distintos al despiece','Diferencia de más de 0,05 m² frente a la medición del despiece.',LIST.filter(p=>{const fm=p.fac.length?p.fac[0].m2:null;return fm!=null&&p.m2!=null&&Math.abs(fm-p.m2)>0.05}).map(p=>p.id));
  add('warn','Color del albarán distinto al plano','El albarán la describe con otro tipo del que tiene en el DWG.',LIST.filter(p=>p.ent.some(e=>e.c&&p.color&&e.c!==p.color)).map(p=>p.id));
  add('warn','Color del pedido distinto al plano','En el pedido figura con otro color del que tiene en el DWG.',LIST.filter(p=>p.peds.some(e=>e.c&&p.color&&e.c!==p.color)).map(p=>p.id));
  add('bad','Entregadas sin pedido registrado','Han llegado en un albarán pero no están en ningún pedido.',LIST.filter(p=>p.ent.some(e=>!p.peds.some(x=>x.fecha<=e.fecha))).map(p=>p.id));
  add('warn','Pedidas dos veces para fabricar','Aparecen en más de un pedido de fabricación.',LIST.filter(p=>p.peds.filter(x=>x.tipo==='fabricacion').length>1).map(p=>p.id));
  add('info','Sin dibujar en el DWG','Existen en el despiece pero no están dibujadas en el plano (trazo discontinuo).',LIST.filter(p=>GEO[p.id]&&GEO[p.id][4]).map(p=>p.id));
  for(const f of facts){
    const s=(f.lineas||[]).reduce((t,l)=>t+(l.m2||0),0);const issues=[];
    if(f.m2Piezas&&Math.abs(s-f.m2Piezas)>0.01)issues.push(`suma de piezas ${f3(s)} m² ≠ ${f3(f.m2Piezas)} m² facturados (dif. ${f3(f.m2Piezas-s)} m² = ${eur((f.m2Piezas-s)*(f.precio||179))})`);
    if(f.m2Piezas&&f.impPiezas&&Math.abs(f.m2Piezas*(f.precio||179)-f.impPiezas)>0.05)issues.push(`importe piezas ${eur(f.impPiezas)} ≠ ${f3(f.m2Piezas)} × ${eur(f.precio)}`);
    const base=(f.impPiezas||0)+(f.impMachi||0)+(f.otros||[]).reduce((t,o)=>t+(o.importe||0),0);
    if(f.base&&Math.abs(base-f.base)>0.05)issues.push(`base imponible ${eur(f.base)} ≠ suma de conceptos ${eur(base)}`);
    if(f.base&&f.total&&Math.abs(f.base*1.21-f.total)>0.05)issues.push(`total ${eur(f.total)} ≠ base + IVA 21 %`);
    if(issues.length)A.push({sev:'bad',t:`Factura ${f.num}: descuadre`,d:issues.join(' · '),codes:[],doc:f.num});
  }
  const mS=albs.reduce((t,a)=>t+(a.machi||0),0)+((S.cfg&&S.cfg.machiManual)||[]).reduce((t,m)=>t+(m.m2||0),0);
  const mF=facts.reduce((t,f)=>t+(f.m2Machi||0),0);
  MACHI={sum:mS,fac:mF};
  if(Math.abs(mS-mF)>0.01)A.push({sev:'warn',t:'Machihembrado: suministrado ≠ facturado',d:`Constan ${f3(mS)} m² en albaranes y registros manuales frente a ${f3(mF)} m² facturados (dif. ${f3(mF-mS)} m²).`,codes:[]});
  ALERTS=A;
}

function drawSvg(vis,refit){
  const svg=$('#plansvg');if(!svg)return;
  if(refit||!UI.vb){
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const p of vis)for(const pt of GEO[p.id][1].split(' ')){const [x,y]=pt.split(',').map(Number);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}

function parseLines(txt){
  const out=[];const re=/B\s*0?(\d{1,2})\s*-\s*(P1|P2|PS|PC|01)\s*-\s*([0-9]{1,2}|[A-Z])\b/gi;
  for(const raw of txt.split(/\n/)){
    const found=[...raw.matchAll(re)];
    found.forEach((mm,ix)=>{
      const pl=mm[2].toUpperCase()==='01'?'P1':mm[2].toUpperCase();const n=/^\d+$/.test(mm[3])?mm[3].padStart(2,'0'):mm[3].toUpperCase();
      const id=`B${mm[1].padStart(2,'0')}-${pl}-${n}`;
      const rest=raw.slice(mm.index+mm[0].length,found[ix+1]?found[ix+1].index:undefined);
      const col=/verde/i.test(rest)?'V':/amarill/i.test(rest)?'A':/roj/i.test(rest)?'R':((rest.match(/^[\s:\-*]*([VAR])\b/i)||[])[1]||'').toUpperCase()||null;
      out.push({p:id,c:col||(P[id]?P[id].color:null),known:!!P[id]});
    });
  }
  return out;
}

function renderRend(m){
  const now=new Date();if(!UI.cal)UI.cal={y:now.getFullYear(),m:now.getMonth()};
  const {y,m:mo}=UI.cal;
  const inst={},arr={},vue={};
  LIST.forEach(p=>{if(p.inst)inst[p.inst]=(inst[p.inst]||0)+1;p.ent.forEach(e=>{if(e.sinAlb)return;(e.vuelta?vue:arr)[e.fecha]=((e.vuelta?vue:arr)[e.fecha]||0)+1})});
  const first=new Date(y,mo,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const last=new Date(y,mo+1,0);const end=new Date(last);end.setDate(last.getDate()+(7-((last.getDay()+6)%7))-1);
  const mesInst=Object.entries(inst).filter(([d])=>d.startsWith(`${y}-${String(mo+1).padStart(2,'0')}`));
  const maxDay=Math.max(1,...Object.values(inst));
  let cells='';const d=new Date(start);const tday=today();
  while(d<=end){
    let wi=0,wa=0,wv=0;
    for(let k=0;k<7;k++){
      const s=iso(d);const n=inst[s]||0,a=arr[s]||0,v=vue[s]||0;wi+=n;wa+=a;wv+=v;
      const we=d.getDay()===0||d.getDay()===6;
      cells+=`<div class="day ${we?'we':''} ${d.getMonth()!==mo?'out':''} ${s===tday?'today':''}"><span class="dn">${d.getDate()}</span>${n?`<span class="inst">${n}<small>inst.</small></span>`:''}${a?`<span class="arr" title="Piezas llegadas en albarán">${ico('down')}${a} llegan</span>`:''}${v?`<span class="arr" style="color:var(--ok)">${ico('back')}${v} vuelven</span>`:''}${n?`<span class="bar" style="width:${n/maxDay*100}%"></span>`:''}</div>`;
      d.setDate(d.getDate()+1);
    }
    cells+=`<div class="wk"><span class="faint">Semana</span><span><b style="color:var(--s-instalada)">${wi}</b> inst.</span><span><b style="color:var(--s-en_obra)">${wa}</b> llegan</span>${wv?`<span style="color:var(--ok)">${wv} vuelven</span>`:''}</div>`;
  }
  const mesN=mesInst.reduce((t,[,n])=>t+n,0);
  const diasCon=mesInst.length;
  const hasta=(y===now.getFullYear()&&mo===now.getMonth())?now:last;
  let lab=0;{const q=new Date(y,mo,1);while(q<=hasta){if(q.getDay()>0&&q.getDay()<6)lab++;q.setDate(q.getDate()+1)}}
  const allDays=Object.entries(inst).sort((a,b)=>b[1]-a[1]);
  // media semanal de llegadas (últimas 8 semanas)
  const wkArr={};Object.entries(arr).forEach(([s,n])=>{const q=new Date(s+'T12:00:00');q.setDate(q.getDate()-((q.getDay()+6)%7));const k=iso(q);wkArr[k]=(wkArr[k]||0)+n});
  const wks=Object.entries(wkArr).sort().slice(-8);const avgArr=wks.length?Math.round(wks.reduce((t,[,n])=>t+n,0)/wks.length):0;
  // periodo
  const {desde,hasta:h2}=UI.rep;
  const inR=LIST.filter(p=>p.inst&&(!desde||p.inst>=desde)&&(!h2||p.inst<=h2)).sort((a,b)=>a.inst.localeCompare(b.inst)||a.id.localeCompare(b.id));
  const bls=[...new Set(LIST.map(p=>p.bl))].sort();

const fotoCache={};
async function hydratePhotos(){
  if(!FOTOS)return;
  for(const img of document.querySelectorAll('img[data-foto]')){
    const path=img.dataset.foto;
    if(fotoCache[path]){if(img.src!==fotoCache[path])img.src=fotoCache[path];continue}
    FOTOS.url(path).then(u=>{if(u){fotoCache[path]=u;document.querySelectorAll(`img[data-foto="${CSS.escape(path)}"]`).forEach(i=>i.src=u)}});
  }
}

function palletSVG({total,rest,cnt,st,match}){
  // una capa por pieza (máx. 12); cada capa rellena con el color de su tipo
  const cap=12;const n=rest;const lv=Math.min(n,cap);const totLv=Math.min(Math.max(total,n),cap);
  const seq=[];['R','A','V'].forEach(c=>{for(let k=0;k<(cnt[c]||0);k++)seq.push(c)});
  const mseq=match?(()=>{const s=[];['R','A','V'].forEach(c=>{for(let k=0;k<(match[c]||0);k++)s.push(c)});return s})():null;
  const H=Math.min(11,68/Math.max(totLv,1)), top=78;
  let layers='';
  for(let k=0;k<lv;k++){
    const idx=Math.floor(k*(seq.length/lv));const c=seq[idx]||'V';
    const y=top-k*H;
    const col=st==='dev'?'var(--s-inc_pale)':`var(--t${c})`;
    layers+=`<rect x="16" y="${y-H+1}" width="88" height="${H-1}" rx="1.6" style="fill:${col};stroke:rgba(0,0,0,.28);stroke-width:.5"/><rect x="18" y="${y-H+1.8}" width="84" height="1.1" rx=".5" style="fill:#fff;opacity:.45"/>`;
  }
  let ghost='';
  if(st!=='dev'&&totLv>lv){const yT=top-(totLv-1)*H-H+1;ghost=`<rect x="16" y="${yT}" width="88" height="${(totLv-lv)*H-1}" rx="1.6" style="fill:none;stroke:var(--ink3);stroke-width:.8;stroke-dasharray:3 2"/>`}
  const yTop=top-(Math.max(lv,1)-1)*H-H;
  const film=st==='cerrado'&&lv?`<rect x="13.5" y="${yTop-1.5}" width="93" height="${lv*H+3.5}" rx="3" style="fill:#CFE6F7;opacity:.55;stroke:#5E9BC8;stroke-width:1.2"/>${[0,1,2,3].map(q=>`<path d="M13.5 ${yTop+q*lv*H/3.2} L106.5 ${yTop+q*lv*H/3.2+8}" style="stroke:#fff;stroke-width:1.4;opacity:.8"/>`).join('')}<rect x="56" y="${yTop-1.5}" width="8" height="${lv*H+3.5}" style="fill:#2F6FB3;opacity:.85"/>`:'';
  const tag=st==='dev'?`<g transform="translate(100 12)"><circle r="11" style="fill:var(--s-inc_pale)"/><use href="#i-back" x="-7" y="-7" width="14" height="14" style="color:#fff"/></g>`:'';
  const base=`<rect x="8" y="79" width="104" height="4.5" rx="1" style="fill:var(--wood)"/><rect x="12" y="83.5" width="12" height="6" style="fill:var(--wood2)"/><rect x="54" y="83.5" width="12" height="6" style="fill:var(--wood2)"/><rect x="96" y="83.5" width="12" height="6" style="fill:var(--wood2)"/><rect x="8" y="89.5" width="104" height="4" rx="1" style="fill:var(--wood)"/>`;
  return `<svg class="pal" viewBox="0 0 120 96" aria-hidden="true">${ghost}${layers}${film}${base}${tag}</svg>`;
}

let toastT;function toast(t){clearTimeout(toastT);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.hidden=false;toastT=setTimeout(()=>el.hidden=true,2800)}
function rerenderKeepScroll(){const m=$('#main');const y=m.scrollTop,wy=window.scrollY;render();m.scrollTop=y;if(narrow())window.scrollTo(0,wy)}

async function doInstall(ids,date){
  const patches={};for(const id of ids){const p=P[id];if(p)patches[id]=withLog(p,`Instalada ${fd(date)}`,{inst:date})}
  await patchPieces(patches,`${ids.length} pieza${ids.length>1?'s':''} instalada${ids.length>1?'s':''} el ${fd(date)}`);
}
async function doUninstall(ids){
  const patches={};for(const id of ids){const p=P[id];if(p&&p.inst)patches[id]=withLog(p,`Quitada instalación (${fd(p.inst)})`,{inst:null})}
  if(Object.keys(patches).length)await patchPieces(patches,'Instalación quitada');
}
function kParse(k){const [id,ix]=k.split('__');return {p:P[id],ix:+ix,id}}
async function saveIncs(p,incs,msg,extra={}){return patchPieces({[p.id]:withLog(p,msg,{...extra,incs})},msg)}
async function currentDev(){
  const open=Object.entries(S.pales).filter(([,x])=>x.tipo==='dev'&&!x.enviado&&!x.cerrado).sort((a,b)=>(b[1].num||0)-(a[1].num||0));
  if(open.length)return open[0][0];
  const nums=Object.values(S.pales).filter(x=>x.tipo==='dev').map(x=>x.num||0);
  const id='D-'+Date.now().toString(36);
  await db.doc('pales/'+id).set({tipo:'dev',num:(nums.length?Math.max(...nums):0)+1,creado:today(),cerrado:false,enviado:null,ref:''});
  return id;
}
function newInc(tipo,dest,desc){const d=today();const i={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),tipo,fecha:d,desc:desc||'',destino:dest||'',fotos:[]};if(dest==='macrif')i.fechaPale=d;return i}
async function compressImage(file){
  const img=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u});
  const max=1600;let {width:w,height:h}=img;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
}

  }
});
document.addEventListener('change',async e=>{

/* pan / zoom / toque en el plano */
(function(){
  let drag=null;const pts=new Map();
  document.addEventListener('pointerdown',e=>{const svg=e.target.closest('#plansvg');if(!svg)return;pts.set(e.pointerId,[e.clientX,e.clientY]);svg.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,vb:[...UI.vb],moved:false,target:e.target.closest('.pc'),shift:e.shiftKey,d0:null}});
  document.addEventListener('pointermove',e=>{if(!drag||!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);const svg=$('#plansvg');if(!svg)return;const r=svg.getBoundingClientRect();
    if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(!drag.d0){drag.d0=d;drag.vb0=[...UI.vb]}const f=drag.d0/d;const v=drag.vb0;const cx=v[0]+v[2]/2,cy=v[1]+v[3]/2;UI.vb=[cx-v[2]*f/2,cy-v[3]*f/2,v[2]*f,v[3]*f];drag.moved=true;applyVB();return}
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;if(!drag.moved)return;const s=Math.max(drag.vb[2]/r.width,drag.vb[3]/r.height);UI.vb=[drag.vb[0]-dx*s,drag.vb[1]-dy*s,drag.vb[2],drag.vb[3]];applyVB()});
  const end=e=>{if(!drag)return;pts.delete(e.pointerId);if(pts.size)return;const d=drag;drag=null;
    if(d.moved)return;
    const vis=visiblePieces();
    if(!d.target){if(!UI.multi&&UI.focus){UI.focus=null;renderSide(vis);drawSvg(vis,false)}return}
    const id=d.target.dataset.id;const p=P[id];
    if(UI.multi){
      if((d.shift||UI.range)&&UI.anchor&&P[UI.anchor]&&P[UI.anchor].bl===p.bl&&P[UI.anchor].pl===p.pl&&UI.anchor!==id){
        const lo=Math.min(P[UI.anchor].o,p.o),hi=Math.max(P[UI.anchor].o,p.o);LIST.filter(q=>q.bl===p.bl&&q.pl===p.pl&&q.o>=lo&&q.o<=hi).forEach(q=>UI.sel.add(q.id));UI.range=false;UI.anchor=null;
      }else{UI.sel.has(id)?UI.sel.delete(id):UI.sel.add(id);UI.anchor=id}
      drawSvg(vis,false);renderSelbar();
    }else{
      UI.focus=UI.focus===id&&!narrow()?null:id;
      if(narrow()){UI.drawer=id;renderDrawer();hydratePhotos()}
      drawSvg(vis,false);renderSide(vis);hydratePhotos();
    }};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',e=>{drag=null;pts.clear()});
  document.addEventListener('wheel',e=>{const svg=e.target.closest('#plansvg');if(!svg)return;e.preventDefault();const [x,y]=svgPt(e);zoomAt(e.deltaY>0?1.15:.87,x,y)},{passive:false});
  window.addEventListener('resize',()=>applyVB());
})();

let rT;function schedule(){clearTimeout(rT);rT=setTimeout(()=>{
  const ae=document.activeElement;const typing=ae&&(ae.tagName==='TEXTAREA'||(ae.tagName==='INPUT'&&['text','search'].includes(ae.type)))&&ae.id!=='tf-q';
  if(typing){schedule._pending=true;return}

(async function boot(){
  const SB_URL='https://gdjiyoghdklzclhelpdn.supabase.co';
  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkaml5b2doZGtsemNsaGVscGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NzI5MzgsImV4cCI6MjEwNTA0ODkzOH0.vBnISXdSFbwrUhitC4CISYFQgZfw1TxK-VimxPwYwVM';

  const L={coll:{},doc:{}};let loaded=false,pending=0;
  const snapDocs=arr=>({docs:arr,size:arr.length,empty:!arr.length,metadata:{hasPendingWrites:pending>0,fromCache:false},docChanges:()=>[]});
  function build(name){
    if(name==='bloques'){const g={};for(const [id,v] of Object.entries(cache.pieza)){const b=id.slice(0,3);(g[b]=g[b]||{bloque:b,piezas:{}}).piezas[id]=v}
      return Object.entries(g).map(([id,d])=>({id,exists:true,data:()=>d}))}
    return Object.entries(cache[name]||{}).map(([id,d])=>({id,exists:true,data:()=>d}));
  }
  function emit(col){
    if(!loaded)return;
    const names=col==='pieza'?['bloques']:[col];
    for(const n of names)(L.coll[n]||[]).forEach(f=>f(snapDocs(build(n))));
    for(const [path,fs] of Object.entries(L.doc)){const [c,id]=path.split('/');if(c===col){const d=cache[c][id];fs.forEach(f=>f({id,exists:!!d,data:()=>d,metadata:{hasPendingWrites:false}}))}}
  }
  const emitAll=()=>['pieza','pedidos','albaranes','facturas','config','retiradas','pales'].forEach(emit);
  const colOf=c=>c==='bloques'?'pieza':c;
  const fail=e=>{throw {code:'unavailable',message:(e&&e.message)||'Error de conexión'}};
  async function track(p){pending++;sync('Guardando…');try{return await p}finally{pending--;if(!pending)sync('Guardado · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}))}}
  async function merge(col,id,patch){const {error}=await sb.rpc('merge_doc',{p_col:col,p_id:id,p_patch:patch});if(error)fail(error);cache[col][id]={...(cache[col][id]||{}),...patch}}
  db={
    collection(name){return {onSnapshot(next,err){(L.coll[name]=L.coll[name]||[]).push(next);if(loaded)next(snapDocs(build(name)));return ()=>{L.coll[name]=L.coll[name].filter(f=>f!==next)}}}},
    doc(path){const [c,id]=path.split('/');const col=colOf(c);return {
      onSnapshot(next){(L.doc[col+'/'+id]=L.doc[col+'/'+id]||[]).push(next);if(loaded){const d=cache[col][id];next({id,exists:!!d,data:()=>d,metadata:{hasPendingWrites:false}})}return ()=>{}},
      async update(obj){return track((async()=>{
        if(c==='bloques'){await Promise.all(Object.entries(obj.piezas||{}).map(([pid,patch])=>merge('pieza',pid,patch)))}
        else await merge(col,id,obj);
        emit(col)})())},
      async set(obj){return track((async()=>{const {error}=await sb.from('docs').upsert({col,id,data:obj});if(error)fail(error);cache[col][id]=obj;emit(col)})())},
      async delete(){return track((async()=>{const {error}=await sb.from('docs').delete().eq('col',col).eq('id',id);if(error)fail(error);delete cache[col][id];emit(col)})())}
    }}
  };
  downloads={async save({filename,data}){const blob=new Blob([data],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return {status:'saved'}}};

  FOTOS={

    async url(path){const {data,error}=await sb.storage.from('fotos').createSignedUrl(path,60*60*12);return error?null:data.signedUrl},
    async remove(path){await sb.storage.from('fotos').remove([path])}
  };
  async function loadAll(){
    const rows=[];let from=0;
    while(true){const {data,error}=await sb.from('docs').select('col,id,data').order('col').order('id').range(from,from+999);if(error)throw error;rows.push(...data);if(data.length<1000)break;from+=1000}
    for(const k of Object.keys(cache))cache[k]={};

    if(!n){$('#main').innerHTML=`<div class="empty panel"><b>Tu usuario (${esc(session.user.email)}) no tiene permiso para ver este proyecto</b>, o la base de datos está vacía.<br>Pide que añadan tu email en la tabla <span class="mono">usuarios_permitidos</span> de Supabase.</div>`;sync('Sin permiso');started=false;return}
    loaded=true;emitAll();sync('En directo');
    channel=sb.channel('docs-cambios').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      if(p.eventType==='DELETE'){const o=p.old||{};if(o.col&&cache[o.col]){delete cache[o.col][o.id];emit(o.col)}return}

    }).subscribe(st=>{if(st==='SUBSCRIBED')sync('En directo');else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')sync('Reconectando…')});
  }

  const msg=(t,bad)=>{const m=$('#lg-msg');m.textContent=t;m.style.color=bad?'var(--bad)':'var(--ok)'};

  });

    const email=$('#lg-email').value.trim();if(!email){msg('Escribe tu email y vuelve a pulsar',true);return}

})();

})();
