<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5E7A">
<title>SKY MARBELLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#EEF0EF; --panel:#FFFFFF; --panel2:#F5F6F5; --ink:#1C2326; --ink2:#51606A; --ink3:#86939B;
  --line:#D9DEDF; --line2:#C4CBCE; --accent:#1F5E7A; --accentInk:#FFFFFF; --accentSoft:#DCEAF0;
  --canvas:#FAFBFA; --sel:#1F5E7A; --palC:#2F6FB3; --palCSoft:#E3EDF7; --palO:#E0A24A;
  --tV:#2E9E4F; --tA:#E0A800; --tR:#D5403A;
  --s-instalada:#15803D; --s-en_obra:#2F6FB3; --s-en_obra-bg:#DCEAF8; --s-pedida:#56687A; --s-pedida-bg:#FFFFFF; --s-medir:#7B4FC9; --s-sin_pedir:#9AA5AD; --s-sin_pedir-bg:#EEF0F1;
  --p-instalada:#15803D; --p-en_obra:#2F6FB3; --p-pedida:#E39410; --p-medir:#7B4FC9; --p-sin_pedir:#E3E7EA;
  --k-instalada:#15803D; --k-en_obra:#3B82C4; --k-pedida:#F2A71B; --k-medir:#7B4FC9; --k-sin_pedir:#D3D8DC; --k-inc:#D81B60; --k-espera:#5A6B8C; --k-descartada:#3A3F44; --kInkDark:#1C2326;
  --wood:#B07A43; --wood2:#8A5A2B; --film:#9CC7E6; --film2:#FFFFFF; --filmOp:.34;
  --s-inc_detectada:#D81B60; --s-inc_pale:#EF7D1A; --s-inc_macrif:#A0522D; --s-inc_reparar:#00838F; --s-descartada:#3A3F44; --s-inc_espera:#4E5D78;
  --ok:#0B6B45; --warn:#B9620B; --bad:#C4204F; --info:#1F5E7A;
  --okSoft:#DDEFE6; --warnSoft:#FBEBD9; --badSoft:#F8DDE6; --infoSoft:#DCEAF0;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#131719; --panel:#1B2124; --panel2:#20272A; --ink:#E4E9EA; --ink2:#A7B3B8; --ink3:#728087;
    --line:#2D3539; --line2:#3B4549; --accent:#6FB3D1; --accentInk:#0E1A20; --accentSoft:#1E3440;
    --canvas:#161B1D; --sel:#6FB3D1; --palC:#5B9BE0; --palCSoft:#1F3347; --palO:#E0A24A;
    --s-sin_pedir:#6C777E; --s-sin_pedir-bg:#262D30; --s-pedida:#9DB0C2; --s-pedida-bg:#1B2124; --s-en_obra:#5B9BE0; --s-en_obra-bg:#1F3347; --s-instalada:#2FB36A; --s-medir:#A07BE6;
    --p-instalada:#2FB36A; --p-en_obra:#4F8FD6; --p-pedida:#E8A33A; --p-medir:#A07BE6; --p-sin_pedir:#3A4448; --s-descartada:#8A9197; --s-inc_macrif:#C0703F; --s-inc_reparar:#20A7B5; --s-inc_espera:#8FA0C0;
    --k-instalada:#2FB36A; --k-en_obra:#4F8FD6; --k-pedida:#E8A33A; --k-medir:#9A73E0; --k-sin_pedir:#4A5358; --k-inc:#F0508A; --k-espera:#7C8CAE; --k-descartada:#8A9197; --kInkDark:#111;
    --ok:#3FBF8A; --warn:#F0A04B; --bad:#F06292; --info:#6FB3D1;
    --okSoft:#17332A; --warnSoft:#3A2A17; --badSoft:#3A1C27; --infoSoft:#1E3440; --film2:#EAF2F6; --filmOp:.15;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.35;margin:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.ico{width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top ---------- */
.top{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;align-items:center;gap:10px 18px;padding:8px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:21px;letter-spacing:.06em}
.brand small{color:var(--ink3);font-size:13px}
.kpis{display:flex;gap:18px;flex-wrap:wrap}
.kpi{display:flex;align-items:center;gap:7px}
.kpi .ico{width:18px;height:18px}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);line-height:1.1}
.tabrow{display:flex;align-items:center;gap:8px;padding-right:14px}
.tabrow .tabs{flex:1;min-width:0}
.userbox{display:flex;align-items:center;gap:8px;flex:none}
.sync{font-size:12px;color:var(--ink3)}
.who{font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px 8px;border-bottom:3px solid transparent;color:var(--ink2);font-weight:600;white-space:nowrap;font-size:15px;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--badSoft);color:var(--bad);font-size:12px;text-align:center}

main{flex:1;min-height:0;overflow:auto;padding:14px 18px 110px}
main.fit{overflow:hidden;display:flex;flex-direction:column;padding-bottom:14px}
main.fit.multi{padding-bottom:84px}
.wrap{max-width:1500px;margin:0 auto}
.wrap.dash{max-width:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;background:var(--panel);flex-wrap:nowrap}
.seg button{border:0;background:none;padding:5px 10px;font-weight:600;color:var(--ink2);border-right:1px solid var(--line);display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:disabled{color:var(--ink3);cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--panel2) 4px 8px)}
.blkgrid{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:5px;overflow:auto;max-width:100%}
.blkgrid button{border:0;background:var(--panel);padding:5px 10px;font-weight:600;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.blkgrid button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.blkgrid button:disabled{color:var(--ink3);cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--panel2) 4px 8px)}
.bloquelbl{font-size:3.4px;font-weight:800;fill:var(--ink2);letter-spacing:.02em}
.btn{border:1px solid var(--line2);background:var(--panel);padding:6px 12px;border-radius:5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.ghost{background:transparent;border-color:color-mix(in srgb,var(--c,var(--bad)) 45%,transparent);color:var(--c,var(--bad))}
.btn.ghost:hover{background:color-mix(in srgb,var(--c,var(--bad)) 9%,transparent);border-color:var(--c,var(--bad))}
.btn.ok{background:var(--s-instalada);border-color:var(--s-instalada);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.warn{color:#fff;background:var(--s-inc_detectada);border-color:var(--s-inc_detectada)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.sm{padding:3px 8px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{border:1px solid var(--line2);background:var(--panel);border-radius:5px;padding:5px 8px;min-width:0}
textarea{width:100%;resize:vertical}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 6px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent;color:#fff;background:var(--c)}
.pill.pale{color:var(--ink);background:var(--bgc);border-color:var(--c)}
.pill.outline{color:var(--ink);background:var(--bgc);border:1.5px dashed var(--c)}
.pill.pale .ico,.pill.outline .ico{color:var(--c)}
.tdot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;flex:none;background:var(--c)}
.tchip{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--okSoft);color:var(--ok)} .chip.warn{background:var(--warnSoft);color:var(--warn)} .chip.bad{background:var(--badSoft);color:var(--bad)} .chip.info{background:var(--infoSoft);color:var(--info)} .chip.neu{background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sechead h2{font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- plano ---------- */
.plantools{flex:none;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.planwrap{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px}
.empty-piece{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:40px 20px!important;color:var(--ink2);height:100%}
.empty-piece .ico{width:34px;height:34px;color:var(--ink3)}
.progress .pbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.progress .pbar u{display:block;height:100%}
.legend.big .lg{grid-template-columns:24px 1fr auto;padding:5px 6px;font-size:14.5px}
.canvasbox{position:relative;height:100%;min-height:300px;overflow:hidden;background:var(--canvas);border:1px solid var(--line);border-radius:6px;touch-action:none}
.canvasbox.multi{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.canvasbox svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.canvasbox .zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.canvasbox .zoom button{width:36px;height:36px;border:1px solid var(--line2);background:var(--panel);border-radius:5px;font-size:18px;font-weight:600}
.canvasbox .ttl{position:absolute;left:12px;top:10px;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.canvasbox .ttl b{font-size:18px;letter-spacing:.04em}
.canvasbox .banner{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:var(--accent);color:var(--accentInk);padding:5px 12px;border-radius:14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.canvasbox .hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--ink3);background:var(--canvas);padding:2px 6px;border-radius:4px}
.pc{cursor:pointer}
#plansvg .pc polygon.body{stroke:var(--canvas)!important;stroke-width:.09;stroke-linejoin:round}
#tlines polygon{fill:none;stroke-width:.34;stroke-linejoin:round;pointer-events:none}
#tlines .dim{opacity:.13}
#tlines .focus{stroke:var(--accent)!important;stroke-width:.5}
.pc polygon.hit{fill:transparent;stroke:transparent;stroke-width:12;vector-effect:non-scaling-stroke}
.pc .tdotS{stroke:var(--canvas);stroke-width:.05}

#plansvg .pc.sel polygon.body{stroke:var(--sel)!important;stroke-width:.14}
.pc polygon.halo{fill:var(--sel);stroke:var(--sel);stroke-width:9;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.9}
.pc.dim{opacity:.13}
.pc.ghost polygon.body{stroke-dasharray:.2 .15}
.pc text{font-family:var(--mono);font-weight:600;pointer-events:none;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke-width:.09;stroke-linejoin:round;fill:var(--ink);stroke:var(--canvas)}
.pc.inst text{fill:#fff;stroke:none}
.pc .badge circle{stroke:var(--canvas);stroke-width:.06}
.pc .badge use{color:#fff}
.pc .selmark circle{fill:var(--sel)}
.pc .selmark use{color:var(--accentInk)}
#notemarks{pointer-events:none}
#notemarks circle{fill:var(--ink);stroke:var(--canvas);stroke-width:.09}
#notemarks use{color:var(--panel)}
#baseplan{pointer-events:none}
#baseplan path{fill:none;stroke:var(--ink3);stroke-width:.8px;vector-effect:non-scaling-stroke;opacity:.5;stroke-linecap:round;stroke-linejoin:round}
.notamk{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:5px;background:var(--ink);color:var(--panel);vertical-align:-3px}
.notamk .ico{width:11px;height:11px}
/* fotos de la pieza con nota */
.pfotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin-top:6px}
.pfoto{margin:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2);display:flex;flex-direction:column}
.pfoto img{width:100%;height:132px;object-fit:cover;background:var(--panel2);cursor:zoom-in;display:block}
.pfoto figcaption{padding:7px;display:flex;flex-direction:column;gap:6px}
.pfoto input{width:100%;font-size:13px;padding:5px 7px}
.pfoto .row{gap:6px;align-items:center}
.pfoto .row .btn{padding:3px 8px;font-size:12px}
.pfoto .row .faint{margin-right:auto}
.addphoto.big.pf{width:auto;flex-direction:column;gap:3px;min-height:132px;height:auto;align-self:stretch;margin-top:0;text-align:center;padding:14px 10px}
.addphoto.big.pf small{font-weight:400;font-size:11.5px}
.notasres{display:flex;gap:8px;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.notasres .ico{width:16px;height:16px;flex:none;margin-top:2px}
.notasres small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
/* mapas con zoom */
.zmapwrap{position:relative;border-radius:7px;overflow:hidden;background:var(--canvas)}
.zmapwrap .zmap{width:100%;height:auto;max-height:340px;display:block;touch-action:none;cursor:grab}
.zmapwrap.zoomed .zmap{cursor:grab}
.zmapwrap .zmap:active{cursor:grabbing}
.zmapc{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
.zmapc button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.9}
.zmapc button:hover{background:var(--panel2);color:var(--ink);opacity:1}
.zmapc .ico{width:15px;height:15px}
.zmapt{position:absolute;left:7px;bottom:7px;font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--ink2)}
/* datos secundarios */
.ministats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ministats>div{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel2)}
.ministats b{display:block;font-size:17px;margin:3px 0 1px;font-variant-numeric:tabular-nums}
.ministats small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35}
/* cabecera de Inicio: ritmo, previsión y objetivo */
.herofoot{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-top:12px}
.hf{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel2)}
.hf>b{display:block;font-size:22px;line-height:1.1;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.hf small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35}
/* fichas de bloque */
.blgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.blcard{padding:12px 13px}
.blcard.vacio{opacity:.6}
.blhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.blhead b{font-size:17px}
.blpc{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--s-instalada)}
.blsub{font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.bltab{width:100%;margin-top:8px;font-size:13px}
.bltab td{padding:3px 4px;border:0}
.bltab tr.click:hover{background:var(--panel2);cursor:pointer}
.bltab td:first-child{color:var(--ink2)}
.blpies{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:7px}
.blpies b{color:var(--ink)}
/* organizar la app */
.orgbtn{flex:none;padding:6px 10px!important;color:var(--ink2)}
.orgbtn .ico{width:17px;height:17px}
.orgtop{padding:12px 14px;border-color:var(--accent);background:var(--accentSoft)}
.orgtop .row{gap:10px;flex-wrap:wrap}
.orghidden{margin-top:10px;border-top:1px solid var(--line2);padding-top:8px}
.dashgrid{display:flex;flex-direction:column;gap:14px}
.wrap.dash .dashgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:start}
.wrap.dash .dbtile{min-width:0}
.orgsize{display:flex;gap:1px;border:1px solid var(--line2);border-radius:5px;overflow:hidden;background:var(--line2)}
.orgsize button{border-radius:0;padding:4px 7px;font-size:11.5px;background:var(--panel)}
.orgsize button.on{background:var(--ink);color:var(--panel)}
@media(max-width:960px){.wrap.dash .dashgrid{grid-template-columns:repeat(6,1fr)}.wrap.dash .dbtile{grid-column:span 6 !important}}
@media(max-width:640px){.wrap.dash .dashgrid{grid-template-columns:1fr}.wrap.dash .dbtile{grid-column:1/-1 !important}}
.orgblk{border:1px dashed var(--line2);border-radius:12px;background:var(--panel2);padding:8px}
.orgblk.dragging{opacity:.75;box-shadow:0 8px 24px rgba(0,0,0,.18);border-color:var(--accent);border-style:solid}
.orgbar{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;flex-wrap:wrap}
.orgbar b{font-size:14px}
.orgbar small{color:var(--ink2);font-size:12.5px}
.orgbtns{display:flex;gap:5px;margin-left:auto;flex:none}
.orgdrag{cursor:grab;font-size:18px;color:var(--ink3);line-height:1;padding:2px 4px;touch-action:none;user-select:none}
body.dragging{user-select:none;cursor:grabbing}
.orgblk.dragging,.orgtab.dragging{position:relative;z-index:5}
.orgover{box-shadow:0 -3px 0 0 var(--accent)}
.orgover-fin{box-shadow:0 3px 0 0 var(--accent)}
.orgbody{pointer-events:none;border-radius:9px;overflow:hidden;background:var(--panel)}
.orgbody .panel{box-shadow:none}
.orgtabs{display:flex;flex-direction:column;gap:6px}
.orgtab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel)}
.orgtab.dragging{opacity:.75;border-color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.orgtab b{font-size:14px}
.orgpags{display:flex;flex-direction:column;gap:6px}
.orgpag{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel);text-align:left;cursor:pointer;width:100%}
.orgpag b{font-size:14px}
.orgpag small{color:var(--ink2);font-size:12.5px;margin-right:auto}
.orgpag:hover{border-color:var(--ink3)}

/* =================== incidencias: normalización =================== */
function normInc(i){
  const o={...i};
  if(!o.tipoInc){o.tipoInc={MAL:'mecanizado',ROTA:'rotura','DAÑADA EN OBRA':'obra',OTRO:'otra'}[o.tipo]||(INC_TIPOS[o.tipo]?o.tipo:'otra')}
  if(o.destino===undefined){o.destino={macrif:'macrif',nueva:'macrif',obra:'obra',descartar:'descartar'}[o.accion]||''}
  if(o.fechaRetirada===undefined&&o.fechaEnvio)o.fechaRetirada=o.fechaEnvio;
  if(o.destino==='obra'&&!o.fechaReparada&&o.resuelta)o.fechaReparada=o.resuelta;
  if(o.destino==='macrif'&&!o.fechaVuelta&&o.resuelta)o.fechaVuelta=o.resuelta;
  if(!o.retiradaRef&&o.pedidoEx)o.retiradaRef=o.pedidoEx;
  o.fotos=o.fotos||[];
  return o;
}
function incFase(p,i){
  if(i.destino==='descartar')return 'descartada';
  if(i.destino==='espera')return (i.fechaResuelta||p.inst)?'resuelta':'espera';
  if(i.destino==='obra')return i.fechaReparada?'reparada':'reparar';
  if(i.destino==='macrif'){
    if(i.fechaRetirada){const b=p.ent.find(e=>e.fecha>i.fechaRetirada);i._back=b||null;return (b||i.fechaVuelta)?'vuelta':'retirada'}

}
function stripInc(i){const o={...i};for(const k of Object.keys(o))if(k.startsWith('_'))delete o[k];delete o.accion;delete o.fechaEnvio;delete o.resuelta;delete o.pedidoEx;if(o.tipoInc){o.tipo=o.tipoInc;delete o.tipoInc}return o}

// devuelve [{src,txt,fecha}] con la nota de la ficha, las de las incidencias y las de las fotos
function notasDe(p){
  const out=[];
  if(p.notas&&p.notas.trim())out.push({src:'ficha',txt:p.notas.trim(),fecha:null});
  (p.incs||[]).forEach(i=>{if(i.desc&&i.desc.trim())out.push({src:'incidencia',txt:i.desc.trim(),fecha:i.fecha,tipo:i.tipoInc})});
  (p.fotos||[]).forEach(f=>{if(f.nota&&f.nota.trim())out.push({src:'foto',txt:f.nota.trim(),fecha:f.fecha,path:f.path})});
  return out;
}

    const t=ALL.map(p=>p.m2Ref||p.m2).filter(Boolean);_m2Med._=t.length?t.reduce((a,x)=>a+x,0)/t.length:0}

/* =================== bloques sin despiece =================== */
// la configuración lista los bloques pendientes; si uno ya tiene piezas, deja de estarlo solo
function bloquesPendientes(){
  const con=new Set(LIST.map(p=>p.bl));
  return ((S.cfg&&S.cfg.bloquesPendientes)||[]).filter(b=>!con.has(b));
}

/* =================== total estimado de la obra =================== */
// solo están dibujados (despiezados) algunos bloques; el resto se estima con la media de los dibujados
function estimTotal(){
  const bls=[...new Set(LIST.map(p=>p.bl))];
  const pend=bloquesPendientes();
  const dib=LIST.length,nDib=bls.length||1;
  const media=dib/nDib;
  const est=dib+Math.round(media*pend.length);
  const m2Med=(()=>{const v=LIST.map(p=>p.m2Ref).filter(x=>x!=null);return v.length?v.reduce((t,x)=>t+x,0)/v.length:null})();
  return {dib,bloquesDib:nDib,bloquesPend:pend.length,bloques:pend,media,est,esEstimado:pend.length>0,m2Est:m2Med!=null?est*m2Med:null};
}

/* =================== avance sobre el total de la obra (10 bloques), por color =================== */
// distingue: pedidas (llegadas + esperando llegar), en obra (llegadas), sin pedir de lo ya dibujado,
// y una estimación por color de lo que falta por pedir de los bloques que aún no tienen despiece
function avanceTotal(){
  const M=macrifData(); // M.sum=en obra por color, M.falta=pedida esperando por color, M.sinPedir=dibujada sin pedir por color
  const E=estimTotal();
  const T=c=>(M.sum[c]||0)+(M.falta[c]||0);
  const pedido={V:T('V'),A:T('A'),R:T('R')};
  const totPedido=pedido.V+pedido.A+pedido.R;
  const totEnObra=(M.sum.V||0)+(M.sum.A||0)+(M.sum.R||0);
  const totFaltaDib=M.totSinP;
  const extra=Math.max(0,E.est-E.dib); // piezas estimadas de los bloques que aún no tienen despiece
  const dibTot=LIST.length||1;
  const propColor={V:0,A:0,R:0};LIST.forEach(p=>{if(propColor[p.color]!=null)propColor[p.color]++});
  let faltaEst={V:Math.round(extra*propColor.V/dibTot),A:Math.round(extra*propColor.A/dibTot),R:0};
  faltaEst.R=Math.max(0,extra-faltaEst.V-faltaEst.A); // ajusta el redondeo para que la suma cuadre exacta
  return {
    totalEstimado:E.est,dibujadas:E.dib,bloquesDib:E.bloquesDib,bloquesPend:E.bloquesPend,bloquesTotal:E.bloquesDib+E.bloquesPend,
    pedido,totPedido,
    enObra:{...M.sum},totEnObra,
    faltaDib:{...M.sinPedir},totFaltaDib,
    faltaEst,totFaltaEst:extra,
    esEstimado:E.esEstimado
  };
}

let P={}, LIST=[], ALL=[], ANUL=[], ALERTS=[], MACHI={}, PEDS=[], PALES=[], DEVS=[], PALOC={};

function buildPales(albs){

      const k=p.ent.map(e=>(e.pale!=null?`${e.fecha}-${e.pale}`:`${e.fecha}-${e.doc}`)).lastIndexOf(g.key);
      const latest=k===p.ent.length-1;const e=p.ent[k];

/* =================== Macrif: qué ha suministrado y a qué ritmo =================== */
function lunesDe(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function macrifData(){
  const albs=Object.values(S.albs).filter(a=>!a.sinAlbaran).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const T=()=>({V:0,A:0,R:0});
  const sum=T(),falta=T(),faltaM2=T(),sinPedir=T();
  let m2=0,piezas=0,m2Vuelta=0,nVuelta=0;
  // una pieza «suministrada» es una pieza que ha llegado alguna vez; los m² son los de su primera entrega
  for(const p of LIST){
    const c=p.color;
    if(p.ent.length){piezas++;if(sum[c]!=null)sum[c]++;m2+=p.ent[0].m2||0;
      const v=p.ent.filter(e=>e.vuelta);nVuelta+=v.length;m2Vuelta+=v.reduce((t,e)=>t+(e.m2||0),0)}
    else if(p.peds.length){if(falta[c]!=null){falta[c]++;faltaM2[c]+=p.m2Ref||p.m2||0}}
    else if(sinPedir[c]!=null)sinPedir[c]++;
  }
  // ritmo: piezas y m² por semana natural, según la fecha del albarán
  const sem={};
  for(const a of albs){const k=lunesDe(a.fecha);const s=sem[k]=sem[k]||{k,piezas:0,m2:0,docs:[]};
    for(const l of (a.lineas||[])){const p=P[l.p];if(p&&p.ent.length&&p.ent[0].doc===a.num){s.piezas++;s.m2+=l.m2||0}}
    s.docs.push(a.num)}
  const semanas=Object.values(sem).sort((a,b)=>a.k.localeCompare(b.k));
  const act=semanas.filter(s=>s.piezas>0);
  const media=act.length?act.reduce((t,s)=>t+s.piezas,0)/act.length:0;
  const mediaM2=act.length?act.reduce((t,s)=>t+s.m2,0)/act.length:0;
  const ult=semanas.slice(-8);

async function patchPieces(patches,msg,opts={}){
  if(!db){toast('Sin conexión con la base de datos');return false}
  // copia de lo anterior para poder deshacer
  const prev={};
  for(const [id,pt] of Object.entries(patches)){const raw=(S.bloques[id.slice(0,3)]||{piezas:{}}).piezas[id]||{};const o={};for(const k of Object.keys(pt)){if(k==='log')continue;o[k]=raw[k]===undefined?null:JSON.parse(JSON.stringify(raw[k]))}prev[id]=o}
  try{
    const res=await db.doc('bloques/x').update({piezas:patches});
    if(msg&&res==='queued')msg+=' · sin cobertura, se enviará sola';
    if(msg){const acts=[];if(!opts.noUndo)acts.push(['Deshacer',async()=>{const up={};for(const [id,o] of Object.entries(prev)){const p=P[id];up[id]=p?withLog(p,'Deshecho: '+msg,o):o}await patchPieces(up,'Deshecho',{noUndo:true})}]);if(opts.next)acts.push(opts.next);toast(msg,acts)}
    return true}
  catch(e){toast('No se ha guardado: '+(e.message||e.code||'sin conexión'),[['Reintentar',()=>patchPieces(patches,msg,opts)]],true);return false}
}

  const m=c.match(/^B?0?(\d{1,2})[-_.\/]?(P1|P2|PS|PC|P?1|P?2|P?S|P?C)[-_.\/]?([0-9]{1,2}|[A-Z])$/);

function miniPlan(id){
  const t=P[id];if(!t||!GEO[id])return '';
  const ps=LIST.filter(q=>q.bl===t.bl&&q.pl===t.pl&&GEO[q.id]);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const q of ps)for(const pt of GEO[q.id][1].split(' ')){const [x,y]=pt.split(',').map(Number);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const pad=2;const g=GEO[id];
  return `<svg class="mini" viewBox="${x0-pad} ${y0-pad} ${x1-x0+2*pad} ${y1-y0+2*pad}" preserveAspectRatio="xMidYMid meet" aria-label="Ubicación de ${id}">${ps.map(q=>`<polygon points="${GEO[q.id][1]}" style="fill:${q.id===id?'var(--s-inc_detectada)':'var(--line2)'};stroke:${q.id===id?'var(--s-inc_detectada)':'var(--canvas)'}"/>`).join('')}<circle cx="${g[2]}" cy="${g[3]}" r="1.6" style="fill:none;stroke:var(--s-inc_detectada);stroke-width:2.5" vector-effect="non-scaling-stroke"/></svg><div class="faint" style="font-size:12px;margin-top:2px">Bloque ${t.bl.slice(1)} · ${PLANTAS[t.pl]} · pieza nº ${t.n}</div>`;
}
function devTarget(){
  const open=Object.entries(S.pales).filter(([,x])=>x.tipo==='dev'&&!x.enviado&&!x.cerrado).sort((a,b)=>(b[1].num||0)-(a[1].num||0));
  if(open.length){const d=DEVS.find(z=>z.id===open[0][0]);return {num:open[0][1].num,nuevo:false,cnt:d?d.items.length:0}}
  const nums=Object.values(S.pales).filter(x=>x.tipo==='dev').map(x=>x.num||0);
  return {num:(nums.length?Math.max(...nums):0)+1,nuevo:true,cnt:0};
}
const INC_ICO={mecanizado:'wrench',rotura:'x',obra:'alert',medios:'lift',andamios:'lift',anulada:'x',otra:'alert'};
function incDestOpts(p,cur,act,attrs,tipo){
  const dt=devTarget();
  const esp=['espera','clock','Dejarla en espera','La pieza está bien: no se puede instalar todavía. Se cierra sola al marcarla instalada','var(--s-inc_espera)'];
  let o=[['macrif','pallet',`Al palé de devolución nº ${dt.num}`,`${dt.nuevo?'Se empieza un palé nuevo':dt.cnt+' pieza'+(dt.cnt===1?'':'s')+' ya dentro'} · vuelve a Macrif con el camión${p.inst?' · se quita la fecha de instalación':''}`,'var(--s-inc_pale)'],
    ['obra','wrench','Reparar en obra','Queda pendiente hasta que se marque reparada','var(--s-inc_reparar)'],
    esp,
    ['descartar','x','Anular la pieza','Sale del cómputo de la obra: deja de contar en el avance y en lo que falta','var(--k-descartada)']];
  // si es por medios auxiliares o andamios, «en espera» es lo natural: va primero
  if(INC_ESPERA.has(tipo))o=[esp,...o.filter(x=>x[0]!=='espera')];
  // si la pieza se anula por cambio de proyecto, «anular» va primero
  if(INC_ANULA.has(tipo))o=[o.find(x=>x[0]==='descartar'),...o.filter(x=>x[0]!=='descartar')];
  return o.map(([k,i,t,s,col])=>`<button class="opt" style="--c:${col}" aria-pressed="${cur===k}" data-act="${act}" ${attrs} data-v="${k}"><span class="oi">${ico(i)}</span><span><b>${t}</b><small>${s}</small></span></button>`).join('');
}

function filtered(){
  const f=UI.tf,q=f.q.trim().toUpperCase().replace(/\s/g,'');
  return ALL.filter(p=>(!q||p.id.includes(q))&&(!f.estado||p.estado===f.estado)&&(!f.bloque||p.bl===f.bloque)&&(!f.planta||p.pl===f.planta)&&(!f.tipo||p.color===f.tipo)&&(!f.fact||p.factEst===f.fact));
}
// todas las fechas que existen en la obra: llegadas (con o sin albarán), instalaciones
// (también las anteriores, si una pieza se instaló más de una vez), retiradas y pedidos
function calFechas(){
  const out=[];
  ALL.forEach(p=>{
    if(p.inst)out.push(p.inst);
    (p.instH||[]).forEach(h=>{if(h&&h.f)out.push(h.f)});
    (p.ent||[]).forEach(e=>{if(e.fecha)out.push(e.fecha)});
    (p.incs||[]).forEach(i=>{if(i.fecha)out.push(i.fecha);if(i.fechaRetirada)out.push(i.fechaRetirada);if(i.fechaVuelta)out.push(i.fechaVuelta)});
  });
  Object.values(S.albs||{}).forEach(a=>{if(a&&a.fecha)out.push(a.fecha)});
  Object.values(S.peds||{}).forEach(d=>{if(d&&d.fecha)out.push(d.fecha)});
  return out.filter(Boolean).sort();
}
// lista de meses del desplegable: desde el primer movimiento de la obra hasta el mes que viene
function calMeses(){
  const ds=calFechas();
  const hoy=new Date();
  const a=new Date((ds[0]||today())+'T12:00:00');
  const b=new Date(hoy.getFullYear(),hoy.getMonth()+1,1);
  const ultima=ds.length?new Date(ds[ds.length-1]+'T12:00:00'):null;
  const fin=ultima&&ultima>b?new Date(ultima.getFullYear(),ultima.getMonth(),1):b;
  const out=[];const d=new Date(a.getFullYear(),a.getMonth(),1);
  while(d<=fin){out.push([d.getFullYear(),d.getMonth(),(s=>s[0].toUpperCase()+s.slice(1))(d.toLocaleDateString('es-ES',{month:'long',year:'numeric'}))]);d.setMonth(d.getMonth()+1)}
  return out.reverse();
}
// fechas que se pintan en el calendario: llegadas e instalaciones (los pedidos no se pintan)
function calFechasCal(){
  const out=[];
  ALL.forEach(p=>{if(p.inst)out.push(p.inst);(p.instH||[]).forEach(h=>{if(h&&h.f)out.push(h.f)});(p.ent||[]).forEach(e=>{if(e.fecha)out.push(e.fecha)})});
  return out.filter(Boolean).sort();
}
// primer mes en el que hubo algo que ver en el calendario (la primera entrega a obra)
function calMesPrimero(){
  const ds=calFechasCal();const hoy=new Date();
  if(!ds.length)return {y:hoy.getFullYear(),m:hoy.getMonth()};
  const d=new Date(ds[0]+'T12:00:00');return {y:d.getFullYear(),m:d.getMonth()};
}
// mes que se abre por defecto: el actual si hay movimiento, si no el último mes con movimiento
function calMesPorDefecto(){
  const hoy=new Date();const act={y:hoy.getFullYear(),m:hoy.getMonth()};
  const ds=calFechas();if(!ds.length)return act;
  const pre=iso(new Date(act.y,act.m,1)).slice(0,7);
  if(ds.some(s=>s.slice(0,7)===pre))return act;
  const u=new Date(ds[ds.length-1]+'T12:00:00');
  return {y:u.getFullYear(),m:u.getMonth()};
}

function parseLines(txt){
  const out=[];const re=/B\s*0?(\d{1,2})\s*-\s*(P1|P2|PS|PC|01)\s*-\s*([0-9]{1,2}|[A-Z])\b/gi;
  for(const raw of txt.split(/\n/)){
    const found=[...raw.matchAll(re)];
    found.forEach((mm,ix)=>{
      const pl=mm[2].toUpperCase()==='01'?'P1':mm[2].toUpperCase();const n=/^\d+$/.test(mm[3])?mm[3].padStart(2,'0'):mm[3].toUpperCase();
      const id=`B${mm[1].padStart(2,'0')}-${pl}-${n}`;
      const rest=raw.slice(mm.index+mm[0].length,found[ix+1]?found[ix+1].index:undefined);
      const col=/verde/i.test(rest)?'V':/amarill/i.test(rest)?'A':/roj/i.test(rest)?'R':((rest.match(/^[\s:\-*]*([VAR])\b/i)||[])[1]||'').toUpperCase()||null;
      out.push({p:id,c:col||(P[id]?P[id].color:null),known:!!P[id]});
    });
  }
  return out;
}

// mapa de una planta resaltando las piezas marcadas (mapa de ubicación de incidencias)
function mapaMarcadas(pl,marcas,titulo,zkey){
  const ps=LIST.filter(p=>p.pl===pl&&GEO[p.id]);if(!ps.length)return '';
  const hay=ps.filter(p=>marcas[p.id]);if(!hay.length)return '';
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const bb={};
  for(const p of ps){const b=bb[p.bl]=bb[p.bl]||[1e9,1e9,-1e9,-1e9];for(const pt of GEO[p.id][1].split(' ')){const [x,y]=pt.split(',').map(Number);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x);b[3]=Math.max(b[3],y)}}
  const pad=3,top=5;
  // el marcador se escala con el tamaño del plano para que se vea igual de claro en todas las plantas
  const r=Math.max(.9,(x1-x0)/75),dy=r*1.9;
  const fondo=ps.filter(p=>!marcas[p.id]).map(p=>`<polygon points="${GEO[p.id][1]}" class="mbg"/>`).join('');
  const marc=hay.map(p=>{const m=marcas[p.id];const g=GEO[p.id];
    return `<g data-open="${p.id}" class="mp mk"><title>${p.id} · ${m.t}</title><polygon points="${g[1]}" style="fill:${m.c}"/><line x1="${g[2]}" y1="${g[3]}" x2="${g[2]}" y2="${(g[3]-dy).toFixed(2)}" style="stroke:${m.c};stroke-width:${(r*.28).toFixed(2)}"/><circle cx="${g[2]}" cy="${(g[3]-dy).toFixed(2)}" r="${r.toFixed(2)}" style="fill:${m.c}"/><use href="#i-${m.i}" x="${(g[2]-r*.62).toFixed(2)}" y="${(g[3]-dy-r*.62).toFixed(2)}" width="${(r*1.24).toFixed(2)}" height="${(r*1.24).toFixed(2)}" style="color:#fff"/></g>`}).join('');
  const labs=Object.entries(bb).map(([b,r])=>{const n=hay.filter(p=>p.bl===b).length;return n?`<text x="${(r[0]+r[2])/2}" y="${r[1]-1.4}" class="mpl">B${b.slice(1)} · ${n}</text>`:''}).join('');
  const vb=`${x0-pad} ${y0-pad-top-r*2} ${x1-x0+2*pad} ${y1-y0+2*pad+top+r*2}`;
  return `<figure class="mapcard"><figcaption><button class="linkbtn" data-act="goplan" data-pl="${pl}" data-bl="ALL"><b>${PLANTAS[pl]}</b></button><span class="muted num">${hay.length} ${titulo}</span></figcaption>
    ${zoomBox((zkey||'mk')+'-'+pl,vb,`${fondo}${marc}${labs}`,'Ubicación en '+PLANTAS[pl])}</figure>`;
}

function perRange(){

  const allInst=LIST.map(p=>p.inst).filter(Boolean).sort();
  if(P_.mode==='origen'){const d0=allInst[0]||today();return {d0,d1:today(),label:`A origen · desde el ${fd(d0)}`}}
  const d0=P_.desde||allInst[0]||today(),d1=P_.hasta||today();

}
function daysBetween(d0,d1){const out=[];const d=new Date(d0+'T12:00:00'),e=new Date(d1+'T12:00:00');while(d<=e){out.push(iso(d));d.setDate(d.getDate()+1)}return out}

function barChartSVG(rows,avg,unit,W=860,H=230){
  // rows: [{k,label,v,we,tip}]

  const x=i=>L+(W-L-R)*(i/n),bw=Math.max(2,(W-L-R)/n-3),y=v=>T+(H-T-B)*(1-v/nice);
  const ticks=[0,nice/4,nice/2,3*nice/4,nice];

const fotoCache={};

function palletSVG({total,rest,cnt,st,match}){
  // una capa por pieza (máx. 12); cada capa rellena con el color de su tipo
  const cap=12;const n=rest;const lv=Math.min(n,cap);const totLv=Math.min(Math.max(total,n),cap);
  const seq=[];['R','A','V'].forEach(c=>{for(let k=0;k<(cnt[c]||0);k++)seq.push(c)});
  const mseq=match?(()=>{const s=[];['R','A','V'].forEach(c=>{for(let k=0;k<(match[c]||0);k++)s.push(c)});return s})():null;
  const H=Math.min(11,68/Math.max(totLv,1)), top=78;
  let layers='';
  for(let k=0;k<lv;k++){
    const idx=Math.floor(k*(seq.length/lv));const c=seq[idx]||'V';
    const y=top-k*H;
    const col=st==='dev'?'var(--s-inc_pale)':`var(--t${c})`;
    layers+=`<rect x="16" y="${y-H+1}" width="88" height="${H-1}" rx="1.6" style="fill:${col};stroke:rgba(0,0,0,.28);stroke-width:.5"/><rect x="18" y="${y-H+1.8}" width="84" height="1.1" rx=".5" style="fill:#fff;opacity:.45"/>`;
  }
  let ghost='';
  if(st!=='dev'&&totLv>lv){const yT=top-(totLv-1)*H-H+1;ghost=`<rect x="16" y="${yT}" width="88" height="${(totLv-lv)*H-1}" rx="1.6" style="fill:none;stroke:var(--ink3);stroke-width:.8;stroke-dasharray:3 2"/>`}
  const yTop=top-(Math.max(lv,1)-1)*H-H;
  // palé precintado: film transparente con brillos y fleje, sin color de marca
  const film=st==='cerrado'&&lv?`<rect x="13.5" y="${yTop-1.5}" width="93" height="${lv*H+3.5}" rx="3" style="fill:var(--film2);opacity:var(--filmOp);stroke:var(--ink3);stroke-width:1"/>${[0,1,2,3].map(q=>`<path d="M13.5 ${yTop+q*lv*H/3.2} L106.5 ${yTop+q*lv*H/3.2+8}" style="stroke:var(--film2);stroke-width:1.6;opacity:.55"/>`).join('')}<rect x="58" y="${yTop-1.5}" width="4" height="${lv*H+3.5}" style="fill:var(--ink2);opacity:.32"/><rect x="13.5" y="${yTop+lv*H*.55}" width="93" height="3" style="fill:var(--ink2);opacity:.26"/>`:'';
  const tag=st==='dev'?`<g transform="translate(101 11)"><circle r="8.5" style="fill:var(--s-inc_pale)"/><use href="#i-back" x="-5.5" y="-5.5" width="11" height="11" style="color:#fff"/></g>`:'';
  const base=`<rect x="8" y="79" width="104" height="4.5" rx="1" style="fill:var(--wood)"/><rect x="12" y="83.5" width="12" height="6" style="fill:var(--wood2)"/><rect x="54" y="83.5" width="12" height="6" style="fill:var(--wood2)"/><rect x="96" y="83.5" width="12" height="6" style="fill:var(--wood2)"/><rect x="8" y="89.5" width="104" height="4" rx="1" style="fill:var(--wood)"/>`;
  return `<svg class="pal" viewBox="0 0 120 96" aria-hidden="true">${ghost}${layers}${film}${base}${tag}</svg>`;
}

const GRP=[['instalada','Instaladas'],['en_obra','En obra sin instalar'],['pedida','Pendientes de llegar'],['inc','Con incidencia'],['espera','En espera'],['medir','Falta medir'],['sin_pedir','Sin pedir']];
const grpOf=p=>p.estado==='inc_espera'?'espera':(p.open||['inc_detectada','inc_pale','inc_macrif','inc_reparar'].includes(p.estado)?'inc':p.estado);
function stackBar(counts,total,h){
  const col=k=>k==='inc'?'var(--k-inc)':k==='espera'?'var(--k-espera)':estColor(k);
  return `<div class="dstack" style="height:${h||14}px">${GRP.map(([k,l])=>counts[k]?`<u style="width:${counts[k]/total*100}%;background:${col(k)}" title="${l}: ${counts[k]}"></u>`:'').join('')}</div>`;
}
// barra apilada genérica a partir de segmentos [{label,val,color}], sobre un total dado
function stackBarSeg(segs,total,h){
  return `<div class="dstack" style="height:${h||14}px">${segs.filter(s=>s.val>0).map(s=>`<u style="width:${(s.val/total*100)}%;background:${s.color}" title="${s.label}: ${s.val}"></u>`).join('')}</div>`;
}
function countGrp(arr){const c={};GRP.forEach(([k])=>c[k]=0);arr.forEach(p=>{const g=grpOf(p);c[g]=(c[g]||0)+1});return c}
function planMap(pl){
  const ps=LIST.filter(p=>p.pl===pl&&GEO[p.id]);if(!ps.length)return '';
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const bb={};
  for(const p of ps){const b=bb[p.bl]=bb[p.bl]||[1e9,1e9,-1e9,-1e9];for(const pt of GEO[p.id][1].split(' ')){const [x,y]=pt.split(',').map(Number);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x);b[3]=Math.max(b[3],y)}}
  const pad=3,top=5;
  const poly=ps.map(p=>`<g data-open="${p.id}" class="mp"><title>${p.id} · ${TIPOS[p.color]?.n||''} · ${ESTM[p.estado].n}${p.inst?' '+fd(p.inst):''}</title><polygon points="${GEO[p.id][1]}" style="fill:${estColor(p.estado)}"/></g>`).join('');
  const tl=ps.map(p=>`<polygon class="mtl" points="${GEO[p.id][1]}" style="stroke:${tipoColor(p.color)}"/>`).join('');
  const labs=Object.entries(bb).map(([b,r])=>{const all=ps.filter(p=>p.bl===b);const i=all.filter(p=>p.inst).length;const inc=all.filter(p=>p.open).length;return `<text x="${(r[0]+r[2])/2}" y="${r[1]-1.4}" class="mpl">B${b.slice(1)} · ${Math.round(i/all.length*100)}%${inc?` · ⚠${inc}`:''}</text>`}).join('');
  const all=ps.length,ins=ps.filter(p=>p.inst).length;
  const vb=`${x0-pad} ${y0-pad-top} ${x1-x0+2*pad} ${y1-y0+2*pad+top}`;
  return `<figure class="mapcard"><figcaption><button class="linkbtn" data-act="goplan" data-pl="${pl}" data-bl="ALL"><b>${PLANTAS[pl]}</b></button><span class="muted num">${ins}/${all} instaladas</span></figcaption>
    ${zoomBox('proy-'+pl,vb,`<g>${tl}</g>${poly}${labs}`,'Mapa de '+PLANTAS[pl])}</figure>`;
}

/* =================== RECUENTO PARA MACRIF (enviadas / pendientes a una fecha) =================== */
function recuento(fecha,nums){
  const cnt=a=>{const o={V:0,A:0,R:0};a.forEach(x=>o[x.c]!=null&&o[x.c]++);return o};
  return PEDS.filter(d=>nums.has(d.num)&&(d.fecha||'')<=fecha).map(d=>{
    const lin=(d.lineas||[]).map(l=>{
      const p=P[l.p];const c=l.c||(p&&p.color);
      const ents=p?p.ent.filter(e=>e.fecha>=(d.fecha||'')&&e.fecha<=fecha):[];
      const first=ents[0];
      const devs=p&&first?p.incs.filter(i=>i.destino==='macrif'&&i.fechaRetirada&&i.fechaRetirada<=fecha):[];
      const last=devs[devs.length-1];
      const vuelta=last?(ents.find(e=>e.fecha>last.fechaRetirada)||(last.fechaVuelta&&last.fechaVuelta<=fecha?{doc:'sin albarán',fecha:last.fechaVuelta}:null)):null;
      const st=!first?'pend':(last&&!vuelta)?'dev':'env';
      const facs=p?p.fac.filter(f=>f.fecha<=fecha):[];
      return {p:l.p,c,m2:p?p.m2Ref:null,st,env:st==='env',ents,devs,facs,alb:first?first.doc:'',falb:first?first.fecha:''};
    });
    const pend=lin.filter(x=>x.st==='pend'),dev=lin.filter(x=>x.st==='dev'),falta=[...dev,...pend];
    return {d,lin,pend,dev,falta,env:lin.length-falta.length,cntP:cnt(falta),m2P:falta.reduce((t,x)=>t+(x.m2||0),0)};
  });
}

const TAB_N={inicio:'Inicio',plano:'Plano',pales:'Palés',piezas:'Piezas',incidencias:'Incidencias',rendimiento:'Avance',macrif:'Proveedores'};
function nombreDe(u){if(!u)return 'Alguien';const n=LIVE&&LIVE.names[String(u).toLowerCase()];return n||String(u).split('@')[0]}
function iniciales(u){const n=nombreDe(u).trim().split(/[\s._-]+/);return ((n[0]||'?')[0]+((n[1]||'')[0]||'')).toUpperCase()}
const PCOL=['#1F5E7A','#8E44AD','#C0392B','#16A085','#D35400','#2C3E50','#7F8C8D','#B7950B'];
function colorDe(u){let h=0;for(const ch of String(u||''))h=(h*31+ch.charCodeAt(0))|0;return PCOL[Math.abs(h)%PCOL.length]}
function avatar(u,sz){return `<span class="av" style="--av:${colorDe(u)};${sz?`width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px`:''}" title="${esc(nombreDe(u))}">${esc(iniciales(u))}</span>`}
function hace(t){const s=Math.round((Date.now()-t)/1000);if(s<45)return 'ahora';if(s<3600)return `hace ${Math.round(s/60)} min`;if(s<86400)return `hace ${Math.round(s/3600)} h`;return new Date(t).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}
// describe un cambio de documento en lenguaje de obra
function describeChange(col,id,op,antes,despues,por,t){
  const a=antes||{},d=despues||{};let who=por,msg='',pieza=null,when=t||Date.now(),key=`${col}/${id}/${op}/${Math.round(when/60000)}`;
  if(col==='pieza'){
    pieza=id;const la=(a.log||[]).length,ld=(d.log||[]);const last=ld[ld.length-1];
    if(op==='DELETE')msg=`Pieza ${id} eliminada`;
    else if(last&&ld.length>la){msg=last.m;who=last.u||por;when=Date.parse(last.t)||when;key=`pieza/${id}/${last.t}`}
    else if(d.notas!==a.notas)msg='Notas editadas';
    else if(d.inst!==a.inst)msg=d.inst?`Instalada ${fd(d.inst)}`:'Quitada instalación';
    else return null; // cambio sin interés (p. ej. reenvío idéntico)
  }else if(col==='pales'){
    const dev=(d.tipo||a.tipo)==='dev';const num=d.num||a.num;
    if(op==='DELETE')msg=dev?`Palé de devolución nº ${num} eliminado`:'Palé: cambio deshecho';
    else if(dev&&!a.tipo)msg=`Palé de devolución nº ${num} empezado`;
    else if(dev&&d.enviado&&d.enviado!==a.enviado)msg=a.enviado?`Envío del palé nº ${num} corregido (${fd(d.enviado)})`:`Palé de devolución nº ${num} enviado a Macrif`;
    else if(dev&&!d.enviado&&a.enviado)msg=`Envío del palé nº ${num} deshecho`;
    else if(dev&&d.cerrado!==a.cerrado)msg=`Palé de devolución nº ${num} ${d.cerrado?'cerrado':'reabierto'}`;
    else if(!dev){const k=(d.key||a.key||id).replace(/^in_/,'');msg=d.vaciado&&!a.vaciado?`Palé ${k} marcado vacío`:d.abierto&&!a.abierto?`Palé ${k} marcado abierto`:`Palé ${k} actualizado`}
    else msg=`Palé de devolución nº ${num} actualizado`;
  }else if(col==='revisiones'){
    const qué=id.startsWith('alb_')?'albarán '+id.slice(4):id.startsWith('fac_')?'factura '+id.slice(4):'comprobación de Macrif';
    msg=op==='DELETE'?`Revisión quitada (${qué})`:`${d.ok?'Revisado':'Nota en'} ${qué}${d.nota?` · «${d.nota}»`:''}`;
  }else if(col==='pedidos')msg=op==='DELETE'?`Pedido ${a.num||id} eliminado`:`Pedido ${d.num||id} ${op==='INSERT'?'añadido':'guardado'}`;
  else if(col==='retiradas')msg=op==='DELETE'?'Retirada eliminada':`Retirada del camión registrada (${(d.piezas||[]).length} piezas)`;
  else if(col==='albaranes')msg=`Albarán ${d.num||a.num||id} ${op==='DELETE'?'eliminado':'cargado'}`;
  else if(col==='facturas')msg=`Factura ${d.num||a.num||id} ${op==='DELETE'?'eliminada':'cargada'}`;
  else msg=`Cambio en ${col}`;
  return {key,col,id,pieza,who,msg,t:when};
}

let pdfLib=null;
function loadPdfLib(){
  if(pdfLib)return pdfLib;
  pdfLib=new Promise((res,rej)=>{
    if(window.pdfjsLib)return res();
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      if(!window.pdfjsLib)return rej(new Error('No se pudo cargar la librería PDF.js'));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      res();
    };
    s.onerror=()=>{pdfLib=null;s.remove();rej(new Error('No se pudo cargar PDF.js (revisa tu conexión a internet)'))};
    document.head.appendChild(s);
  });
  return pdfLib;
}
const PC={ink:[28,35,38],ink2:[81,96,106],ink3:[134,147,155],line:[217,222,223],soft:[245,246,245],soft2:[236,242,244],acc:[31,94,122],accSoft:[220,234,240],
  env:[21,128,61],envSoft:[221,239,230],pend:[185,98,11],pendSoft:[251,235,217],dev:[160,82,45],devSoft:[244,228,218],V:[46,158,79],A:[224,168,0],R:[213,64,58],white:[255,255,255]};
const n3=v=>v==null?'—':Number(v).toLocaleString('es-ES',{minimumFractionDigits:3,maximumFractionDigits:3});

function pdfDoc(orient){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4',orientation:orient||'portrait'});doc.setLineHeightFactor(1.25);return doc}
const PW=doc=>doc.internal.pageSize.getWidth(),PH=doc=>doc.internal.pageSize.getHeight();
function txt(doc,s,x,y,{size=9,bold=false,color=PC.ink,align='left',maxW}={}){doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);doc.setTextColor(...color);doc.text(maxW?doc.splitTextToSize(String(s),maxW):String(s),x,y,{align})}
function pdfCabecera(doc,tipo,titulo,fechaTxt,sub){
  const W=PW(doc);
  txt(doc,'SKY MARBELLA',M,M+5,{size:17,bold:true,color:PC.acc});
  txt(doc,'Cantos de forjado · Solid surface Betacryl 100 Classic White',M,M+10.5,{size:8,color:PC.ink3});
  txt(doc,tipo.toUpperCase(),W-M,M+3.5,{size:7.5,bold:true,color:PC.ink3,align:'right'});
  txt(doc,fechaTxt,W-M,M+10.5,{size:15,bold:true,align:'right'});
  doc.setDrawColor(...PC.acc);doc.setLineWidth(.8);doc.line(M,M+15,W-M,M+15);doc.setLineWidth(.2);
  txt(doc,titulo,M,M+25,{size:15,bold:true});
  let y=M+25;
  if(sub){const lines=doc.splitTextToSize(sub,W-2*M);txt(doc,lines,M,y+6,{size:9,color:PC.ink2});y+=6+(lines.length-1)*4.2}
  return y+6;
}
function pdfKpis(doc,y,cards){
  const W=PW(doc),gap=3.5,w=(W-2*M-gap*(cards.length-1))/cards.length,h=21;
  cards.forEach(([label,val,col,sub],i)=>{const x=M+i*(w+gap);
    doc.setFillColor(...PC.soft);doc.setDrawColor(...PC.line);doc.roundedRect(x,y,w,h,1.6,1.6,'FD');
    doc.setFillColor(...(col||PC.ink3));doc.rect(x,y,w,1.3,'F');
    txt(doc,label.toUpperCase(),x+3,y+6.3,{size:6.6,bold:true,color:PC.ink3});
    txt(doc,String(val),x+3,y+14.8,{size:15,bold:true,color:col||PC.ink});
    if(sub)txt(doc,sub,x+3,y+18.8,{size:6.8,color:PC.ink3})});
  return y+h;
}
function pdfBarra(doc,y,parts,total){ // barra apilada con leyenda
  const W=PW(doc),w=W-2*M;let x=M;
  doc.setFillColor(...PC.soft2);doc.roundedRect(M,y,w,3.6,1.8,1.8,'F');
  parts.forEach(([,v,col])=>{if(!v||!total)return;const ww=w*v/total;doc.setFillColor(...col);doc.rect(x,y,ww,3.6,'F');x+=ww});
  let lx=M;parts.forEach(([l,v,col])=>{doc.setFillColor(...col);doc.circle(lx+1.2,y+8.3,1.2,'F');const s=`${l}: ${v} (${total?Math.round(v/total*100):0}%)`;txt(doc,s,lx+3.4,y+9.3,{size:7.8,color:PC.ink2});lx+=doc.getTextWidth(s)+10});
  return y+12;
}
function pdfPies(doc,izq){
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);const W=PW(doc),H=PH(doc);doc.setDrawColor(...PC.line);doc.line(M,H-11,W-M,H-11);
    txt(doc,izq,M,H-6.5,{size:7,color:PC.ink3});
    if(i>1){txt(doc,'SKY MARBELLA',M,M-3,{size:8,bold:true,color:PC.acc});txt(doc,izq.replace('SKY MARBELLA · ',''),W-M,M-3,{size:7.5,color:PC.ink3,align:'right'});doc.setDrawColor(...PC.acc);doc.setLineWidth(.3);doc.line(M,M-1,W-M,M-1);doc.setLineWidth(.2)}txt(doc,`Página ${i} de ${n}`,W-M,H-6.5,{size:7,color:PC.ink3,align:'right'})}
}
function pill(doc,cell,label,col,soft){

let PREV=null;
async function vistaPrevia(builder){
  const o=$('#pdfprev');
  o.hidden=false;o.innerHTML=`<div class="pvbar"><b>Abriendo documento…</b><span></span><span class="pvbtns"><button class="btn sm" data-act="pvclose">${ico('x')} Cerrar</button></span></div><div class="pvpages"><div class="pvload">Cargando…</div></div>`;
  document.body.classList.add('pvopen');
  try{
    const r=await builder();if(o.hidden)return;
    const blob=r.doc?r.doc.output('blob'):r.blob;const tipo=r.tipo||'application/pdf';const esImg=/^image\//.test(tipo);
    PREV={blob,nombre:r.nombre,tipo};
    const canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],r.nombre,{type:tipo})]}));
    const bar=n=>`<div class="pvbar"><b>${esc(r.titulo)}</b><span class="faint">${esImg?'Imagen':`${n} página${n>1?'s':''}`}${r.doc?' · A4':''}</span><span class="pvbtns">${canShare?`<button class="btn sm" data-act="pvshare">Compartir</button>`:''}<button class="btn sm pri" data-act="pvdown">${ico('down')} Descargar</button><button class="btn sm" data-act="pvclose" aria-label="Cerrar">${ico('x')}</button></span></div><div class="pvpages" id="pvpages"></div>`;
    if(esImg){o.innerHTML=bar(1);const u=URL.createObjectURL(blob);$('#pvpages').innerHTML=`<img class="pvpage pvimg" src="${u}" alt="${esc(r.titulo)}">`;return}
    await loadPdfLib();
    const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
    o.innerHTML=bar(pdf.numPages);const cont=$('#pvpages');
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);const vp1=page.getViewport({scale:1});
      const cssW=Math.min(cont.clientWidth-24,900);const scale=cssW/vp1.width;const dpr=Math.min(window.devicePixelRatio||1,2);
      const vp=page.getViewport({scale:scale*dpr});
      const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;cv.style.width=cssW+'px';cv.style.height=(vp.height/dpr)+'px';cv.className='pvpage';
      cont.appendChild(cv);await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      if(o.hidden)return;
    }
  }catch(e){o.innerHTML=`<div class="pvbar"><b>No se pudo abrir el documento</b><span></span><span class="pvbtns"><button class="btn sm" data-act="pvclose">Cerrar</button></span></div><div class="pvpages"><div class="pvload">${esc(e.message||e)}</div></div>`}
}

/* =================== SUGERENCIAS EN LOS BUSCADORES =================== */
const SUG_INPUTS={gsearch:'open',findpiece:'open','newinc-code':'open','pf-q':'fill','tf-q':'fill'};
const SUGS={el:null,input:null,items:[],act:-1};
function sugMatches(q){
  const s=String(q||'').toUpperCase().replace(/[\s_.\/-]/g,'');if(!s)return [];
  const out=[];
  for(const p of LIST){const m=p.id.match(/^B0?(\d+)-(P.)-(\w+)$/);const k1=p.id.replace(/-/g,'');
    const ks=m?[k1,'B'+m[1]+m[2]+m[3],m[1]+m[2]+m[3],m[1]+m[2].slice(1)+m[3]]:[k1];
    if(ks.some(k=>k.startsWith(s)))out.push(p)}
  if(!out.length)for(const p of LIST)if(p.id.replace(/-/g,'').includes(s))out.push(p);
  return out;
}
const SHORT={instalada:'Instalada',en_obra:'En obra',pedida:'Pedida',medir:'Medir',sin_pedir:'Sin pedir',inc_detectada:'Incidencia',inc_pale:'En palé dev.',inc_macrif:'En Macrif',inc_reparar:'Reparar',inc_espera:'En espera',descartada:'Anulada'};
function sugShow(input){
  const ms=sugMatches(input.value);
  if(!SUGS.el){SUGS.el=document.createElement('div');SUGS.el.className='sugg';SUGS.el.setAttribute('role','listbox');document.body.appendChild(SUGS.el);
    SUGS.el.addEventListener('mousedown',e=>e.preventDefault());
    SUGS.el.addEventListener('click',e=>{const b=e.target.closest('[data-sg]');if(b)sugPick(b.dataset.sg)})}
  if(!ms.length||!input.value.trim()){sugHide();return}
  SUGS.input=input;SUGS.items=ms.slice(0,8);SUGS.act=-1;
  const r=input.getBoundingClientRect();const w=Math.max(r.width,280);
  const left=Math.min(r.left,window.innerWidth-w-8);
  Object.assign(SUGS.el.style,{left:Math.max(8,left)+'px',top:(r.bottom+4)+'px',width:w+'px',display:'block'});
  const q=input.value.toUpperCase();
  SUGS.el.innerHTML=SUGS.items.map((p,i)=>`<button type="button" role="option" class="sg" data-sg="${p.id}" id="sg-${i}"><span class="sgid mono">${tdot(p.color)} ${p.id}</span><span class="sgmeta">${PLANTAS[p.pl].replace('Planta ','')} · B${p.bl.slice(1)}</span><span class="sgst" style="--c:${estColor(p.estado)};color:${estInk(p.estado)}">${SHORT[p.estado]||''}</span></button>`).join('')+
    (ms.length>8?`<div class="sgmore">${ms.length-8} más · sigue escribiendo para afinar</div>`:'')+
    `<div class="sgmore">${ms.length} pieza${ms.length===1?'':'s'} ${ms.length===1?'coincide':'coinciden'}</div>`;
}
function sugHide(){if(SUGS.el)SUGS.el.style.display='none';SUGS.items=[];SUGS.act=-1}
function sugPick(id){
  const input=SUGS.input;if(!input)return;const mode=SUG_INPUTS[input.id];sugHide();
  if(mode==='open'){input.value=input.id==='gsearch'?'':id;input.blur();openPiece(id)}
  else{input.value=id;input.dispatchEvent(new Event(input.id==='tf-q'?'input':'change',{bubbles:true}))}
}
document.addEventListener('input',e=>{if(SUG_INPUTS[e.target.id])sugShow(e.target)});
document.addEventListener('focusin',e=>{if(SUG_INPUTS[e.target.id]&&e.target.value)sugShow(e.target)});
document.addEventListener('focusout',e=>{if(SUG_INPUTS[e.target.id])setTimeout(()=>{if(document.activeElement!==SUGS.input)sugHide()},150)});
document.addEventListener('keydown',e=>{
  if(!SUGS.items.length||e.target!==SUGS.input)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SUGS.act=(SUGS.act+(e.key==='ArrowDown'?1:-1)+SUGS.items.length)%SUGS.items.length;
    SUGS.el.querySelectorAll('.sg').forEach((b,i)=>b.classList.toggle('act',i===SUGS.act));}
  else if(e.key==='Enter'){if(SUGS.act>=0){e.preventDefault();e.stopPropagation();sugPick(SUGS.items[SUGS.act].id)}else if(SUGS.items.length===1){e.preventDefault();e.stopPropagation();sugPick(SUGS.items[0].id)}else sugHide()}
  else if(e.key==='Escape'){sugHide()}
},true);
window.addEventListener('scroll',e=>{if(!SUGS.items.length||!SUGS.input)return;if(SUGS.el.contains(e.target))return;const r=SUGS.input.getBoundingClientRect();if(r.bottom<0||r.top>window.innerHeight)sugHide();else SUGS.el.style.top=(r.bottom+4)+'px'},true);
window.addEventListener('resize',()=>sugHide());

function adjMatch(nombre,prov){
  const up=nombre.toUpperCase();
  const src=prov==='ainan'?{alb:(S.ainan||{}).alb||{},fac:(S.ainan||{}).fac||{},ped:(S.ainan||{}).ped||{}}
    :prov==='betacril'?{alb:(S.bet||{}).alb||{},fac:(S.bet||{}).fac||{},ped:(S.bet||{}).ped||{}}
    :{alb:S.albs,fac:S.facts,ped:S.peds};
  const nums=(o)=>Object.values(o).map(d=>d.num).filter(Boolean);
  const pref=/FACT/.test(up)?['fac','alb','ped']:/ALB/.test(up)?['alb','fac','ped']:/PED/.test(up)?['ped','alb','fac']:['alb','fac','ped'];
  const clean=up.replace(/[^A-Z0-9]/g,'');
  for(const t of pref)for(const n of nums(src[t]).sort((a,b)=>b.length-a.length)){const nn=String(n).toUpperCase().replace(/[^A-Z0-9]/g,'');if(nn.length>=4&&clean.includes(nn))return {tipo:t,num:n}}

    if(fechas.length)prim.push(diasEntre(d.fecha,fechas[0]));
    if(d.pend===0&&fechas.length)comp.push(diasEntre(d.fecha,fechas[fechas.length-1]));
    else if(d.lineasX.length)vivos.push(d);
  }
  const mComp=media(comp),p80=pctl(comp,80);
  const ref=Math.round(p80||mComp||45);
  return {prim:media(prim),comp:mComp,p80,ref,nComp:comp.length,nPrim:prim.length,
    // pedidos abiertos que ya han pasado del plazo habitual
    tarde:vivos.filter(d=>d.dn>ref).sort((a,b)=>b.dn-a.dn),vivos};
}

/* ---- antigüedad del material que está en obra sin colocar ---- */
function materialEnObra(){
  const hoy=today();
  const items=LIST.filter(p=>p.estado==='en_obra'&&p.ent.length)
    .map(p=>({p,desde:p.ent[p.ent.length-1].fecha,dias:diasEntre(p.ent[p.ent.length-1].fecha,hoy)}))
    .sort((a,b)=>b.dias-a.dias);
  const porZona={};
  items.forEach(x=>{const k=x.p.bl+'|'+x.p.pl;(porZona[k]=porZona[k]||{bl:x.p.bl,pl:x.p.pl,n:0,max:0,m2:0}).n++;
    porZona[k].max=Math.max(porZona[k].max,x.dias);porZona[k].m2+=x.p.m2Ref||0});
  return {items,zonas:Object.values(porZona).sort((a,b)=>b.n-a.n),viejas:items.filter(x=>x.dias>=45)};
}

/* ---- avisos con antigüedad: lo que hay que mover hoy ---- */
function avisos(){
  const A=[];const hoy=today();
  const add=(sev,ico_,t,d,codes,act)=>{if(codes.length||d.forzar)A.push({sev,ico:ico_,t,d:d.txt,codes,act,n:d.n??codes.length})};
  const P=plazoMacrif();const M=materialEnObra();
  // 1 · incidencias que nadie ha decidido
  const sinDec=LIST.filter(p=>p.open&&p.open._fase==='detectada').map(p=>({p,dias:diasEntre(p.open.fecha,hoy)}));
  const sinDec2=sinDec.filter(x=>x.dias>=2);
  add('bad','alert','Incidencias sin decidir',{txt:sinDec2.length?`La más antigua lleva ${Math.max(...sinDec2.map(x=>x.dias))} días esperando. Hasta que no se decida qué se hace, la pieza no avanza.`:''},
    sinDec2.map(x=>x.p.id),{act:'tab',v:'incidencias'});
  // 2 · palé de devolución preparado que no sale
  const devs=DEVS.filter(d=>!d.enviado&&d.items.length);
  const devViejo=devs.map(d=>({d,dias:diasEntre(d.creado||d.items[0].i.fechaPale||hoy,hoy)})).filter(x=>x.dias>=7);
  add('warn','pallet','Palés de devolución sin salir',{txt:devViejo.length?`${devViejo.reduce((t,x)=>t+x.d.items.length,0)} piezas llevan hasta ${Math.max(...devViejo.map(x=>x.dias))} días preparadas. Mientras no salgan, Macrif no las repone.`:'',n:devViejo.reduce((t,x)=>t+x.d.items.length,0),forzar:devViejo.length>0},
    devViejo.flatMap(x=>x.d.items.map(i=>i.p.id)),{act:'tab',v:'pales'});
  // 3 · piezas retiradas que no vuelven
  const lim3=Math.max(21,P.ref);
  const noVuelven=LIST.filter(p=>p.open&&p.open._fase==='retirada').map(p=>({p,dias:diasEntre(p.open.fechaRetirada,hoy)})).filter(x=>x.dias>=lim3);
  add('bad','truck','Piezas en Macrif que no vuelven',{txt:noVuelven.length?`Se retiraron hace más de ${lim3} días y todavía no han aparecido en ningún albarán. Toca reclamar.`:''},
    noVuelven.map(x=>x.p.id),{act:'tab',v:'incidencias'});
  // 4 · pedidos que pasan del plazo habitual
  add('warn','clock','Pedidos fuera de plazo',{txt:P.tarde.length?`Macrif tarda de media ${Math.round(P.comp||0)} días en completar un pedido (${P.ref} en el peor caso). Estos ya lo han superado: ${P.tarde.slice(0,4).map(d=>`${d.num} (${d.dn} días, faltan ${d.pend})`).join(' · ')}.`:'',n:P.tarde.length,forzar:P.tarde.length>0},
    [],{act:'ped'});
  // 5 · material en obra criando polvo
  add('warn','box','Material en obra sin colocar hace tiempo',{txt:M.viejas.length?`Llevan más de 45 días en obra (hasta ${M.viejas[0].dias}). Cuanto más tiempo pasan en el palé, más riesgo de golpe o pérdida.`:''},
    M.viejas.map(x=>x.p.id),{act:'goplan',v:'obra'});
  // 6 · piezas en espera de medios o andamios
  const esp=LIST.filter(p=>p.estado==='inc_espera').map(p=>({p,dias:diasEntre(p.open.fecha,hoy)})).filter(x=>x.dias>=7);
  add('warn','clock','En espera de medios o andamios',{txt:esp.length?`Bloqueadas desde hace hasta ${Math.max(...esp.map(x=>x.dias))} días. Son piezas buenas que no se pueden colocar.`:''},
    esp.map(x=>x.p.id),{act:'goplan',v:'espera'});
  // 7 · piezas pendientes de medir
  const med=LIST.filter(p=>p.estado==='medir');
  add('info','ruler','Pendientes de medir en obra',{txt:med.length?'Hasta que no se midan no se pueden pedir, y el plazo de Macrif empieza a contar el día que se pide.':''},
    med.map(p=>p.id),{act:'goplan',v:'medir'});
  // 8 · piezas dibujadas que nadie ha pedido todavía
  const sinp=LIST.filter(p=>p.estado==='sin_pedir');
  add('warn','clock','Piezas dibujadas sin pedir',{txt:sinp.length?`Si se piden hoy, con el plazo habitual de Macrif (${P.ref} días) no estarían en obra hasta el ${fd(iso(new Date(Date.now()+P.ref*864e5)))}.`:'',n:sinp.length},
    sinp.length>40?[]:sinp.map(p=>p.id),{act:'ped'});
  // 9 · costillas
  const C=typeof costillasData==='function'?costillasData():null;
  if(C&&C.nec-C.ped>0)A.push({sev:'warn',ico:'wrench',t:'Costillas por pedir a Mecanizados Ainan',d:`Faltan ${C.nec-C.ped} de las ${C.nec} que pide el despiece dibujado.`,codes:[],n:C.nec-C.ped,act:{act:'goprov',v:'ainan'}});
  // 10 · comprobaciones de proveedor
  const pend=typeof alertOk==='function'?ALERTS.filter(a=>a.sev!=='info'&&!alertOk(a)):[];
  if(pend.length)A.push({sev:'info',ico:'select',t:'Comprobaciones de albaranes y facturas',d:'Descuadres entre lo entregado y lo facturado que nadie ha revisado todavía.',codes:[],n:pend.length,act:{act:'goprov',v:'macrif'}});
  const ord={bad:0,warn:1,info:2};
  return A.sort((a,b)=>ord[a.sev]-ord[b.sev]||b.n-a.n);
}

/* ---- objetivo, ritmo necesario y fecha prevista ---- */
function labEntre(a,b){let n=0;const d=new Date(a+'T12:00:00'),h=new Date(b+'T12:00:00');d.setDate(d.getDate()+1);while(d<=h){const w=d.getDay();if(w>0&&w<6)n++;d.setDate(d.getDate()+1)}return n}
function sumaDiasLab(desde,n){const d=new Date(desde+'T12:00:00');let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w>0&&w<6)k++}return iso(d)}
function prevision(){
  const hoy=today();
  const ins=LIST.filter(p=>p.inst);
  const total=LIST.length,falta=total-ins.length;
  // ritmo real de las últimas 4 semanas (días laborables)
  const d0=iso(new Date(Date.now()-27*864e5));
  const rec=ins.filter(p=>p.inst>=d0).length;const lab=labEntre(d0,hoy)||1;
  const ritmo=rec/lab;
  const objetivo=(S.plan&&S.plan.fecha)||null;
  const E=estimTotal();
  const out={total,instaladas:ins.length,falta,ritmo,rec,objetivo,estimado:E};
  out.fin=ritmo>0?sumaDiasLab(hoy,Math.ceil(falta/ritmo)):null;
  if(objetivo){
    out.labObj=labEntre(hoy,objetivo);
    out.necesario=out.labObj>0?falta/out.labObj:Infinity;
    out.desvio=out.fin?labEntre(objetivo,out.fin)||-labEntre(out.fin,objetivo):null;
    out.semaforo=!out.labObj||out.necesario===Infinity?'bad':ritmo>=out.necesario?'ok':ritmo>=out.necesario*0.85?'warn':'bad';
  }
  return out;
}

/* =================== PIEZAS ANULADAS: qué dejamos de hacer y qué nos cuesta =================== */
function precioM2(){
  const f=Object.values(S.facts).filter(x=>x.precio).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return f.length?f[0].precio:179;
}
function anuladasData(){
  const pr=precioM2();
  const items=ANUL.map(p=>{
    const i=[...p.incs].reverse().find(x=>x.destino==='descartar')||{};
    const E=m2De(p);const m2=E.m2;
    const grupo=p.inst?'instalada':p.ent.length?'enobra':p.peds.length?'pedida':'sinpedir';
    return {p,i,motivo:(i.desc||'').trim(),fecha:i.fecha||null,tipo:i.tipoInc,quien:i.por||'',
      m2,m2est:E.est,grupo,facturada:p.fac.length>0,
      m2fac:p.fac.length?(p.fac[0].m2||m2):0};
  }).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||a.p.id.localeCompare(b.p.id));
  const g=k=>items.filter(x=>x.grupo===k);
  const sum=a=>({n:a.length,m2:a.reduce((t,x)=>t+x.m2,0),eur:a.reduce((t,x)=>t+x.m2,0)*pr});
  const fac=items.filter(x=>x.facturada);
  const total=sum(items);const nEst=items.filter(x=>x.m2est).length;
  const totalObra=LIST.length;
  const V=prevision();
  return {items,pr,total,nEst,
    instaladas:sum(g('instalada')),enObra:sum(g('enobra')),pedidas:sum(g('pedida')),sinPedir:sum(g('sinpedir')),
    facturadas:{n:fac.length,m2:fac.reduce((t,x)=>t+x.m2fac,0),eur:fac.reduce((t,x)=>t+x.m2fac,0)*pr},
    costillas:items.reduce((t,x)=>t+(x.p.cost??2),0),
    totalObra,antes:totalObra+items.length,
    diasMenos:V.ritmo>0?Math.round(items.length/V.ritmo):null,
    sinMotivo:items.filter(x=>!x.motivo).length};
}

// orden actual de una pantalla: respeta lo guardado y añade al final lo que sea nuevo
function ordenDe(pag){
  const todos=(BLOQUES[pag]||[]).map(b=>b[0]);
  const def=DEF_OCULTOS[pag]||[];
  const g=PREF.layout[pag];
  const tam={...(TAM_DEF[pag]||{}),...((g&&g.s)||{})};
  if(!g)return {orden:todos.filter(k=>!def.includes(k)),ocultos:def.slice(),tam};
  const orden=(g.o||[]).filter(k=>todos.includes(k));
  const ocultos=(g.h||[]).filter(k=>todos.includes(k));
  // un bloque nuevo aparece solo si no viene apagado de fábrica
  todos.forEach(k=>{if(!orden.includes(k)&&!ocultos.includes(k)){if(def.includes(k))ocultos.push(k);else orden.push(k)}});
  return {orden,ocultos,tam};
}

let toastT;function toast(t,acts,sticky){clearTimeout(toastT);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}

  (acts||[]).forEach(([l,f])=>{const bt=document.createElement('button');bt.textContent=l;bt.onclick=ev=>{ev.stopPropagation();el.hidden=true;f()};el.appendChild(bt)});
  el.hidden=false;toastT=setTimeout(()=>el.hidden=true,sticky==='inc'?15000:sticky?12000:(acts&&acts.length?6500:2800))}
function tapPiece(id,shift){

/* No se puede dar por instalada una pieza que no consta que haya llegado a obra:
   si no hay albarán ni entrega registrada, lo más probable es que sea otra pieza o falte el albarán.
   Se puede forzar, pero queda escrito quién lo hizo y sale en las comprobaciones. */
function sinLlegada(ids){return ids.filter(x=>P[x]&&!P[x].ent.length)}
async function doInstall(ids,date,withNext,forzar){
  const todas=ids.slice();
  const faltan=sinLlegada(todas);
  if(faltan.length&&!forzar){
    const uno=faltan.length===1;
    toast(uno?`${faltan[0]}: no consta que haya llegado a obra. No aparece en ningún albarán ni entrega.`
      :`${faltan.length} de las ${todas.length} piezas no constan como llegadas a obra.`,
      [['Registrar la llegada',()=>{UI.tab='macrif';UI.prov='macrif';UI.mtab='albaranes';saveUI();$('#main').dataset.view='';render()}],
       ['Instalar igualmente',()=>doInstall(todas,date,withNext,true)]],true);
    ids=todas.filter(x=>!faltan.includes(x));
    if(!ids.length)return;
  }
  const patches={};for(const id of ids){const p=P[id];if(!p)continue;
    const extra={inst:date};
    // queda constancia: se instaló sin que constara la llegada
    if(!p.ent.length)extra.instSinAlb={f:date,por:me(),cuando:today()};
    else if(p.instSinAlb)extra.instSinAlb=null;
    // una pieza que estaba «en espera» (medios auxiliares, andamios) se resuelve al instalarse
    if(p.incs.some(i=>i.destino==='espera'&&!i.fechaResuelta)){extra.incs=incsFor(p).map((x,ix)=>p.incs[ix].destino==='espera'&&!x.fechaResuelta?{...x,fechaResuelta:date}:x)}
    patches[id]=withLog(p,`Instalada ${fd(date)}${!p.ent.length?' · SIN constar su llegada a obra':''}`,extra)}
  const nx=withNext&&ids.length===1?nextOf(ids[0]):null;
  await patchPieces(patches,`${ids.length===1?ids[0]+' instalada':ids.length+' piezas instaladas'} el ${fd(date)}${date!==today()?' (¡no es hoy!)':''}`,nx?{next:['Siguiente ›',()=>{UI.pv==='list'||UI.tab!=='plano'?openPiece(nx.id):openPiece(nx.id)}]}:{});
}
async function doUninstall(ids){
  const patches={};for(const id of ids){const p=P[id];if(p&&p.inst)patches[id]=withLog(p,`Quitada instalación (${fd(p.inst)})`,{inst:null})}
  if(Object.keys(patches).length)await patchPieces(patches,'Instalación quitada');
}

function quitarInst(p,motivo){
  if(!p||!p.inst)return {};
  const h=[...(p.instH||[]).map(x=>({...x})),{f:p.inst,quitada:today(),por:me(),motivo:motivo||''}];

async function compressImage(file){
  const img=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u});
  const max=1600;let {width:w,height:h}=img;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
}

/* arrastrar bloques y secciones para reordenarlos */
(function(){
  let d=null;
  const scroller=el=>{const m=el.closest('#main');return (m&&m.scrollHeight>m.clientHeight+4)?m:document.scrollingElement};
  function marcar(){
    [...d.L.children].forEach(x=>x.classList.remove('orgover','orgover-fin'));
    const otros=d.items.filter(r=>r.el!==d.it);
    if(d.idx<otros.length)otros[d.idx].el.classList.add('orgover');
    else if(otros.length)otros[otros.length-1].el.classList.add('orgover-fin');
  }
  function calcular(pageY){
    const centro=d.c0+(pageY-d.y0);
    let idx=0;
    for(const r of d.items){if(r.el===d.it)continue;if(centro>r.top+r.h/2)idx++}
    d.idx=idx;
  }
  document.addEventListener('pointerdown',e=>{
    const h=e.target.closest('[data-orgdrag]');if(!h)return;
    const it=h.closest('[data-ob]');const L=it&&it.closest('[data-orglist]');if(!L)return;
    e.preventDefault();
    const sy=window.scrollY||document.documentElement.scrollTop||0;
    const items=[...L.children].filter(x=>x.dataset.ob).map(el=>{const r=el.getBoundingClientRect();return {el,top:r.top+sy,h:r.height}});
    const r0=items.find(x=>x.el===it);
    d={L,it,pag:L.dataset.orglist,items,y0:e.pageY,c0:r0.top+r0.h/2,idx:items.findIndex(x=>x.el===it),cont:scroller(L),cy:e.clientY};
    it.classList.add('dragging');document.body.classList.add('dragging');
    try{h.setPointerCapture(e.pointerId)}catch(x){}
    calcular(e.pageY);marcar();
    // si arrastras cerca del borde, la pantalla acompaña
    (function auto(){if(!d)return;const H=window.innerHeight;
      const arr=d.cy-100,ab=H-130-d.cy;let dz=0;
      if(arr<0)dz=Math.max(-24,arr/3);else if(ab<0)dz=Math.min(24,-ab/3);
      if(dz){const c=d.cont;const antes=c.scrollTop;c.scrollTop=antes+dz;
        const real=c.scrollTop-antes;
        if(real){d.it.style.transform=`translateY(${(d.pageY||d.y0)+real-d.y0}px)`;d.pageY=(d.pageY||d.y0)+real;calcular(d.pageY);marcar()}}
      requestAnimationFrame(auto)})();
  });
  document.addEventListener('pointermove',e=>{
    if(!d)return;e.preventDefault();
    d.cy=e.clientY;d.pageY=e.pageY;
    d.it.style.transform=`translateY(${e.pageY-d.y0}px)`;
    calcular(e.pageY);marcar();
  },{passive:false});
  const fin=()=>{
    if(!d)return;const D=d;d=null;
    D.it.style.transform='';D.it.classList.remove('dragging');document.body.classList.remove('dragging');
    [...D.L.children].forEach(x=>x.classList.remove('orgover','orgover-fin'));
    const claves=D.items.map(x=>x.el.dataset.ob);
    const k=D.it.dataset.ob;const sin=claves.filter(x=>x!==k);
    sin.splice(Math.min(D.idx,sin.length),0,k);
    if(sin.join()===claves.join())return;
    if(D.pag==='__tabs'){PREF.tabs={o:sin,h:(PREF.tabs&&PREF.tabs.h)||[]};guardarPref();kpis();renderDrawer()}
    else{const {ocultos}=ordenDe(D.pag);guardarOrden(D.pag,sin,ocultos);$('#main').dataset.view='';render()}
  };
  document.addEventListener('pointerup',fin);document.addEventListener('pointercancel',fin);
})();

(function(){

      const f=d.d0/dd;const v=d.vb0;const cx=v[0]+v[2]/2,cy=v[1]+v[3]/2;d.moved=true;

      if(await loadSnap()){applyOutbox();offlineMode=true;online=false;loaded=true;emitAll();status();startChannel();return}
      sync('Sin conexión');$('#main').innerHTML=`<div class="empty panel">No se han podido leer los datos y este dispositivo todavía no tiene copia guardada: ${esc(e.message||e)}<br>Abre la app una vez con cobertura para poder usarla después sin señal.</div>`;started=false;return}
    if(!n){$('#main').innerHTML=`<div class="empty panel"><b>Tu usuario (${esc(session.user.email)}) no tiene permiso para ver este proyecto</b>, o la base de datos está vacía.<br>Pide que añadan tu email en la tabla <span class="mono">usuarios_permitidos</span> de Supabase.</div>`;sync('Sin permiso');started=false;return}
    loaded=true;emitAll();status();flush();startChannel();
  }
  function startChannel(){
    if(channel)return;
    channel=sb.channel('docs-cambios').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      onDocEvent(p);
      if(p.eventType==='DELETE'){const o=p.old||{};if(o.col&&cache[o.col]){delete cache[o.col][o.id];emit(o.col)}return}
      const r=p.new;if(!r||!r.col)return;(cache[r.col]=cache[r.col]||{})[r.id]=r.data;outbox.filter(o=>o.col===r.col&&o.id===r.id).forEach(applyOp);emit(r.col);saveSnap();
    }).subscribe(st=>{if(st==='SUBSCRIBED'){online=true;status()}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){status()}});
  }
  async function refresh(){if(!loaded)return;if(outbox.length){await flush();if(outbox.length)return}
    try{await withTimeout(loadAll(),25000);online=true;emitAll();status()}catch(e){online=false;status()}}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
  window.addEventListener('online',()=>{online=true;refresh()});
  window.addEventListener('offline',()=>{online=false;status()});
  setInterval(()=>{if(loaded&&(outbox.length||fotosPend||!online||offlineMode))refresh()},30000);
  document.addEventListener('click',ev=>{if(ev.target.closest('#sync')||ev.target.closest('[data-act="flushnow"]')){ev.preventDefault();toast('Intentando enviar…');refresh()}});
  window.addEventListener('beforeunload',ev=>{if(outbox.length&&!navigator.onLine){}});
  idb.keys('fotos').then(k=>{fotosPend=k.length;status()}).catch(()=>{});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});

  /* ---- login ---- */
  const err=e=>{};
  db.collection('bloques').onSnapshot(s=>{S.bloques={};s.docs.forEach(d=>S.bloques[d.id]=d.data());S.loaded.b=true;schedule()},err);
  db.collection('albaranes').onSnapshot(s=>{S.albs={};s.docs.forEach(d=>S.albs[d.id]=d.data());S.loaded.a=true;schedule()},err);
  db.collection('facturas').onSnapshot(s=>{S.facts={};s.docs.forEach(d=>S.facts[d.id]=d.data());S.loaded.f=true;schedule()},err);
  db.collection('pedidos').onSnapshot(s=>{S.peds={};s.docs.forEach(d=>S.peds[d.id]=d.data());schedule()},err);
  db.collection('pales').onSnapshot(s=>{S.pales={};s.docs.forEach(d=>S.pales[d.id]=d.data());schedule()},err);
  db.collection('retiradas').onSnapshot(s=>{S.rets={};s.docs.forEach(d=>S.rets[d.id]=d.data());schedule()},err);
  db.collection('adjuntos').onSnapshot(s=>{S.adj={};s.docs.forEach(d=>S.adj[d.id]=d.data());schedule()},err);
  ['ped','alb','fac'].forEach(k=>db.collection({ped:'ainan_pedidos',alb:'ainan_albaranes',fac:'ainan_facturas'}[k]).onSnapshot(s=>{S.ainan[k]={};s.docs.forEach(d=>S.ainan[k][d.id]=d.data());schedule()},err));
  ['ped','alb','fac'].forEach(k=>db.collection({ped:'betacril_pedidos',alb:'betacril_albaranes',fac:'betacril_facturas'}[k]).onSnapshot(s=>{S.bet[k]={};s.docs.forEach(d=>S.bet[k][d.id]=d.data());schedule()},err));
  db.collection('revisiones').onSnapshot(s=>{S.revs={};s.docs.forEach(d=>S.revs[d.id]=d.data());schedule()},err);
  db.doc('config/proyecto').onSnapshot(s=>{S.cfg=s.exists?s.data():null;schedule()},err);
  db.doc('config/objetivo').onSnapshot(s=>{S.plan=s.exists?s.data():null;schedule()},err);


  const msg=(t,bad)=>{const m=$('#lg-msg');m.textContent=t;m.style.color=bad?'var(--bad)':'var(--ok)'};
  $('#lg-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const email=$('#lg-email').value.trim(),pass=$('#lg-pass').value;
    if($('#lg-form').dataset.mode==='recovery'){
      if(pass.length<8){msg('La contraseña debe tener al menos 8 caracteres',true);return}
      const {error}=await sb.auth.updateUser({password:pass});
      if(error){msg('No se pudo cambiar: '+error.message,true);return}
      msg('Contraseña cambiada. Ya estás dentro.');$('#lg-form').dataset.mode='';const {data}=await sb.auth.getSession();if(data.session)start(data.session);return;
    }
    msg('Entrando…');
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){msg(error.message==='Invalid login credentials'?'Email o contraseña incorrectos':'No se pudo entrar: '+error.message,true);return}
    msg('');try{localStorage.setItem('sky-last-user',data.session.user.email)}catch(x){}start(data.session);
  });
  $('#lg-forgot').addEventListener('click',async()=>{
    const email=$('#lg-email').value.trim();if(!email){msg('Escribe tu email y vuelve a pulsar',true);return}
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    msg(error?'No se pudo enviar: '+error.message:'Te hemos enviado un email para crear una contraseña nueva.',!!error);
  });
  $('#logout').addEventListener('click',async()=>{if(outbox.length&&!confirm(`Hay ${outbox.length} cambios sin enviar. Si sales ahora se quedan guardados en este dispositivo y se enviarán cuando vuelvas a entrar. ¿Salir?`))return;await sb.auth.signOut();location.reload()});
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){$('#login').hidden=false;$('#lg-form').dataset.mode='recovery';$('#lg-title').textContent='Crea tu nueva contraseña';$('#lg-email').closest('label').hidden=true;$('#lg-forgot').hidden=true;$('#lg-btn').textContent='Guardar contraseña';return}
    if(ev==='SIGNED_OUT'){$('#login').hidden=false}
  });
  let session=null;
  try{session=(await withTimeout(sb.auth.getSession(),8000)).data.session}catch(x){}
  const lastUser=localStorage.getItem('sky-last-user');
  if(session){try{localStorage.setItem('sky-last-user',session.user.email)}catch(x){}}
  if(!session&&lastUser&&!navigator.onLine){session={user:{email:lastUser}}}
  if(!session&&lastUser){try{const s=await idb.get('kv','snap');if(s&&(!navigator.onLine))session={user:{email:lastUser}}}catch(x){}}
  if(session&&!location.hash.includes('type=recovery'))start(session);
  else{$('#login').hidden=false;sync('Sin sesión');$('#main').innerHTML='';setTimeout(()=>$('#lg-email')&&$('#lg-email').focus(),50)}
})();

})();</script></body></html>
